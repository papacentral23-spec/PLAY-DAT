<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>body{margin:0;background:#0a0a0f;color:#fff;font-family:system-ui;text-align:center}header{padding:12px;border-bottom:3px solid #d4af37;position:sticky;top:0;background:#0a0a0f}.vu{display:flex;gap:2px;height:44px;background:#000;padding:4px}.b{flex:1;background:#d4af37;height:10%}.card{margin:16px;padding:24px;background:#111;border:2px solid #d4af37;border-radius:16px}#np{font-size:28px;color:#d4af37;font-weight:900;margin:12px 0;line-height:1.2}button{padding:14px 24px;background:#d4af37;color:#000;border:0;border-radius:10px;font-weight:900;margin:6px}.small{font-size:11px;color:#888;margin-top:10px}</style></head><body>
<header>🔥  
  | <span id="cs">🟡 Connecting...</span> 👥<b id="lc">1</b></header><div class="vu" id="vu"></div>
<div class="card"><div style="color:#aaa;font-size:12px;letter-spacing:2px">LIVE NOW FROM MID SEA STUDIO/div><div id="np">Waiting for Studio to play track...</div><div style="margin:16px 0;color:#ccc">🎧 - </div><button onclick="join()">👋 JOIN SHOW</button><div class="small">When 🟢 LIVE, Studio online now!<br>Audio comes from SIRDIO   - 

</div></div>
<script>
let vu=document.getElementById('vu');for(let i=0;i<20;i++){let d=document.createElement('div');d.className='b';vu.appendChild(d);}setInterval(()=>{for(let c of vu.children)c.style.height=(Math.random()*80+10)+'%';},120);
let brokers=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8000/mqtt'],idx=0,client=null;
function tryConn(){if(idx>=brokers.length){document.getElementById('cs').textContent='🔴 Offline - DJ offline';return;}let c=mqtt.connect(brokers[idx],{keepalive:30,connectTimeout:5000});let to=setTimeout(()=>{try{c.end();}catch(e){}idx++;tryConn();},6000);c.on('connect',()=>{clearTimeout(to);client=c;document.getElementById('cs').textContent='🟢 LIVE - DJ ONLINE';c.subscribe('sirdio/host/nowplaying');c.subscribe('sirdio/listener/join');c.publish('sirdio/listener/join','1');c.on('message',(t,m)=>{if(t.includes('nowplaying'))document.getElementById('np').textContent=m.toString();if(t.includes('listener/join'))document.getElementById('lc').textContent=parseInt(document.getElementById('lc').textContent)+1;});});c.on('error',()=>{clearTimeout(to);idx++;tryConn();});}tryConn();
function join(){if(client&&client.connected){client.publish('sirdio/listener/join','1');alert('Joined! DJ sees you! 👥');}else alert('Wait for 🟢 LIVE');}
</script></body></html>s
