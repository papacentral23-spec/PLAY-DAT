<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY DAT Radio - Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1a1a1a;border-radius:20px;padding:30px;max-width:400px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5);border:1px solid #333}
.logo{font-size:32px;font-weight:900;margin-bottom:5px;color:#ffcc00}
.live{color:#00ff88;font-weight:bold;letter-spacing:2px;margin-bottom:20px;font-size:14px}
.art{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#ffcc00,#ff6a00);border-radius:15px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:80px}
h1{font-size:20px;margin-bottom:5px}
p{color:#aaa;font-size:14px;margin-bottom:25px}
button{background:#ffcc00;color:#000;border:none;padding:16px 0;width:100%;border-radius:50px;font-size:18px;font-weight:800;cursor:pointer;transition:0.2s}
button:hover{background:#fff;transform:scale(1.02)}
.status{margin-top:15px;font-size:13px;color:#666}
audio{width:100%;margin-top:20px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<div class="logo">PLAY DAT</div>
<div class="live">● LIVE ON AIR</div>
<div class="art">▶</div>
<h1>Papa Central Live</h1>
<p>Committed To Quality - Kumasi</p>
<button id="playBtn" onclick="togglePlay()">▶ PLAY LIVE</button>
<audio id="player" controls style="display:none"></audio>
<div class="status" id="status">Tap play to listen</div>
</div>

<script>
let isPlaying=false;
const player=document.getElementById('player');
const btn=document.getElementById('playBtn');
const status=document.getElementById('status');

// REPLACE THIS WITH YOUR LIVE STREAM LINK LATER
const streamUrl = ""; 

function togglePlay(){
 if(!isPlaying){
  // If you have a stream, it will play. If not, it shows demo mode.
  if(streamUrl){
   player.src=streamUrl;
   player.play();
  }
  btn.innerHTML="⏸ PAUSE";
  status.innerHTML="🔊 Playing Live - Loud & Clear!";
  status.style.color="#00ff88";
  isPlaying=true;
 }else{
  player.pause();
  btn.innerHTML="▶ PLAY LIVE";
  status.innerHTML="Paused";
  status.style.color="#666";
  isPlaying=false;
 }
}
</script>
</body>
</html>
