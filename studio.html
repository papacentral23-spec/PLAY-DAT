<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT STUDIO</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;text-align:center}
.top{background:linear-gradient(90deg,gold,orange);color:#000;padding:10px;font-weight:bold;display:flex;justify-content:space-between}
.box{background:#151515;margin:10px;padding:14px;border-radius:12px;border:1px solid #333}
input{padding:12px;border-radius:8px;border:1px solid gold;background:#000;color:#fff;width:70%;font-size:16px}
.btn{padding:12px 22px;border:none;border-radius:25px;font-weight:bold;margin:5px}
.gold{background:gold;color:#000}.green{background:#0f0;color:#000}.red{background:red;color:#fff}
video{width:100%;max-height:180px;background:#000;border-radius:10px}
</style></head><body>
<div class="top"><span>👑 PLAY DAT STUDIO</span><span id="dot">⚫ OFFLINE</span></div>
<div class="box">
<input id="hostId" value="PLAYDAT999"><br><br>
<button class="btn gold" onclick="startStudio()">START</button>
<button class="btn green" id="goBtn" onclick="goLive()" style="display:none">🔴 GO LIVE</button>
<button class="btn red" id="stopBtn" onclick="stopLive()" style="display:none">⏹️ STOP</button>
<div id="stat" style="margin-top:10px;color:#aaa;font-size:12px">Type ID and START</div>
</div>
<div class="box">
<video id="localV" autoplay muted playsinline></video>
<div>🎤 <span id="micStat">Mic OFF</span> | 👥 <span id="cnt">0</span></div>
<audio id="mp3Player" controls style="width:100%;margin-top:10px"></audio>
<input type="file" id="mp3File" accept="audio/*" style="margin-top:8px">
</div>
<script>
let peer, myStream, mp3Stream, audioCtx, connections=[];
function getId(){return document.getElementById('hostId').value.trim()||'PLAYDAT999';}
async function startStudio(){
 try{
  myStream=await navigator.mediaDevices.getUserMedia({
    video:{width:640,height:360},
    audio:{channelCount:2,echoCancellation:false,autoGainControl:false,noiseSuppression:false,sampleRate:48000}
  });
  document.getElementById('localV').srcObject=myStream;
  document.getElementById('micStat').innerText='STEREO ON';
  document.getElementById('mp3File').addEventListener('change',e=>{
    let file=e.target.files[0]; if(!file) return;
    let url=URL.createObjectURL(file);
    let player=document.getElementById('mp3Player'); player.src=url;
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    let source=audioCtx.createMediaElementSource(player);
    let dest=audioCtx.createMediaStreamDestination();
    source.connect(dest); source.connect(audioCtx.destination);
    mp3Stream=dest.stream;
  });
  peer=new Peer(getId());
  peer.on('open',()=>{
    document.getElementById('dot').innerText='🟠 READY';
    document.getElementById('stat').innerText='✅ TAP GO LIVE';
    document.getElementById('goBtn').style.display='inline-block';
  });
  peer.on('call',call=>{
    let streamToSend=(mp3Stream)? new MediaStream([...myStream.getVideoTracks(),...mp3Stream.getAudioTracks()]):myStream;
    call.answer(streamToSend);
    connections.push(call);
    document.getElementById('cnt').innerText=connections.length;
  });
  peer.on('error',e=>{document.getElementById('stat').innerText='ID Taken - Try other ID'});
 }catch(err){document.getElementById('stat').innerText='Mic Error: '+err.message}
}
function goLive(){document.getElementById('dot').innerText='🔴 LIVE STEREO';document.getElementById('stat').innerText='🔴 LIVE - STEREO!';document.getElementById('goBtn').style.display='none';document.getElementById('stopBtn').style.display='inline-block';}
function stopLive(){peer.destroy();document.getElementById('dot').innerText='⚫ OFFLINE';}
</script></body></html>
