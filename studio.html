<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY-DAT STUDIO</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>body{background:#1a1a1a;color:#fff;font-family:Arial;margin:0}.top{background:linear-gradient(90deg,#C9A227,#FFD700,#C9A227);color:#111;padding:14px;font-weight:900;font-size:22px;text-align:center}.sub{background:#2e2e2e;color:#FFD700;padding:6px;font-size:11px;letter-spacing:2px;text-align:center}.box{background:#2e2e2e;border:1.5px solid #FFD700;margin:12px;border-radius:14px;padding:12px}.deck{color:#FFD700;font-size:19px;font-weight:800;text-align:center}input{background:#fff;color:#111;padding:12px;width:75%;text-align:center;border-radius:10px;border:0;font-weight:bold}button{background:#FFD700;color:#111;padding:12px 28px;border-radius:25px;border:0;font-weight:900;font-size:16px;margin:8px}button.live{background:#d32f2f;color:#fff;padding:16px;font-size:17px;width:92%}iframe{width:100%;height:250px;border:0;border-radius:10px}audio{width:100%}.livebar{background:#FFD700;color:#111;padding:9px;font-weight:900;margin-top:8px;border-radius:6px;text-align:center}</style></head><body>
<div class="top">PLAY-DAT WORLD</div><div class="sub">VIRTUAL ROOM FOR STUDIO - DJ CONTROL ONLY</div>
<div class="box"><div class="deck">DECK A - VIRTUAL ROOM VIDEO</div><br><input id="yt" value="id7JOjDMmEI"><br><button onclick="loadYT()">LOAD</button><br><iframe id="ytf" src="https://www.youtube.com/embed/id7JOjDMmEI?autoplay=1&mute=1" allow="autoplay"></iframe><div class="livebar">▶ PLAY-DAT 🔴 LIVE</div><p>Vol</p><input type="range" style="width:90%"></div>
<div class="box"><div class="deck">DECK B - VOICE / ALHA-01</div><p id="s">⚪ OFFLINE - Ready</p><p>👥 <span id="c">0</span> Listeners</p><input type="file" id="f" accept="audio/*"><audio id="aud" controls></audio><p id="m">No MP3 yet - Choose ALHA-01.mp3</p><button class="live" onclick="goLive()">🔴 GO LIVE - VOICE + MP3 ALWAYS</button><p id="mic" style="color:#FFD700">Mic: Not yet</p></div>
<script>
let peer, micStream, mixedStream, audCtx;
document.getElementById('f').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let a=document.getElementById('aud');a.src=URL.createObjectURL(file);a.load();document.getElementById('m').innerText='✅ '+file.name+' - READY';});
function loadYT(){let id=document.getElementById('yt').value.trim();document.getElementById('ytf').src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1';}
async function goLive(){
document.getElementById('s').innerText='🔴 LIVE - Starting Mic + MP3 Mix...';
try{micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});document.getElementById('mic').innerText='✅ Mic: ALLOWED - Voice will go!';}catch(e){document.getElementById('mic').innerText='❌ Mic BLOCKED - Allow Mic!';alert('ALLOW MIC - Press Allow!');return;}
audCtx=new (window.AudioContext||window.webkitAudioContext)();
let dest=audCtx.createMediaStreamDestination();
let micSrc=audCtx.createMediaStreamSource(micStream);micSrc.connect(dest);
let a=document.getElementById('aud');
if(a.src){let mp3Src=audCtx.createMediaElementSource(a);mp3Src.connect(dest);mp3Src.connect(audCtx.destination);}
mixedStream=dest.stream;
peer=new Peer('PLAY-DAT-LIVE-1');
peer.on('open',()=>{document.getElementById('s').innerText='🔴 LIVE - PLAY-DAT-LIVE-1 - VOICE + MP3 MIXED - ALWAYS';playAll();});
peer.on('call',call=>{call.answer(mixedStream);setTimeout(()=>{document.getElementById('c').innerText=Object.keys(peer.connections).length},500);});
}
function playAll(){let id=document.getElementById('yt').value.trim();document.getElementById('ytf').src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=0';let a=document.getElementById('aud');if(a.src){a.play().catch(()=>{});}document.getElementById('s').innerText='🔴 LIVE - PLAY-DAT-LIVE-1 - 🔊 VOICE + MP3 PLAYING';}
</script></body></html>
