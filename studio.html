<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT STUDIO</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;text-align:center}
.top{background:gold;color:#000;padding:12px;font-weight:bold}
.box{background:#111;margin:10px;padding:12px;border-radius:12px;border:1px solid #333}
input{padding:10px;width:60%;background:#000;color:#fff;border:1px solid gold;border-radius:8px}
.btn{padding:12px 20px;border:none;border-radius:25px;font-weight:bold;margin:5px}
.gold{background:gold;color:#000}.green{background:#0f0;color:#000}.red{background:red;color:#fff}.blue{background:#0af;color:#fff}.gray{background:#555;color:#fff}
video{width:100%;max-height:220px;background:#000;border-radius:12px}
.row{display:flex;justify-content:center;gap:10px;margin-top:10px}
</style>
</head>
<body>
<div class="top">👑 PLAY DAT STUDIO - </div>

<div class="box">
<input id="hostId" value="PLAYDAT999">
<button class="btn gold" onclick="start()">START</button>
<div id="status" style="margin-top:8px;color:#aaa">Ready</div>
<br>
<button class="btn green" id="goBtn" onclick="goLive()" style="display:none">🔴 GO LIVE</button>
<button class="btn red" id="stopBtn" onclick="stopLive()" style="display:none">⏹️ STOP</button>
</div>

<div class="box">
<video id="myVideo" autoplay muted playsinline></video>
<div class="row">
<button class="btn blue" id="voiceBtn" onclick="toggleVoice()">🎤 VOICE: ON</button>
<button class="btn gray" id="musicBtn" onclick="toggleMusic()">🎵 MUSIC: OFF</button>
</div>
<div style="font-size:13px;margin-top:8px">
👥 <span id="cnt">0</span> Listeners | <span id="mode">VOICE MODE</span>
</div>
<audio id="player" controls style="width:100%;margin-top:10px"></audio>
<input type="file" id="file" accept="audio/*" style="margin-top:6px">
</div>

<script>
let peer, myStream, mp3Stream, audioCtx, connections=[];
let voiceOn=true, musicOn=false, voiceTrack;

async function start(){
myStream=await navigator.mediaDevices.getUserMedia({video:true,audio:{channelCount:2,echoCancellation:false,autoGainControl:false,noiseSuppression:false,sampleRate:48000}});
document.getElementById('myVideo').srcObject=myStream;
voiceTrack=myStream.getAudioTracks()[0];
document.getElementById('file').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f) return;
 let url=URL.createObjectURL(f);
 let p=document.getElementById('player'); p.src=url;
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 let src=audioCtx.createMediaElementSource(p);
 let dest=audioCtx.createMediaStreamDestination();
 src.connect(dest); src.connect(audioCtx.destination);
 mp3Stream=dest.stream;
});
peer=new Peer(document.getElementById('hostId').value||'PLAYDAT999');
peer.on('open',()=>{document.getElementById('status').innerText='✅ Ready - Tap GO LIVE';document.getElementById('goBtn').style.display='inline-block';});
peer.on('call',call=>{
 let tracks=[]; if(voiceOn && voiceTrack) tracks.push(voiceTrack); if(musicOn && mp3Stream) tracks=tracks.concat(mp3Stream.getAudioTracks());
 let combined=new MediaStream([...myStream.getVideoTracks(),...tracks]);
 call.answer(combined); connections.push(call); document.getElementById('cnt').innerText=connections.length;
});
}

function toggleVoice(){
voiceOn=!voiceOn;
document.getElementById('voiceBtn').innerText=voiceOn?'🎤 VOICE: ON':'🔇 VOICE: OFF';
document.getElementById('voiceBtn').className=voiceOn?'btn blue':'btn gray';
if(voiceTrack) voiceTrack.enabled=voiceOn;
document.getElementById('mode').innerText=voiceOn?(musicOn?'VOICE+MUSIC':'VOICE MODE'):'MUSIC ONLY';
}

function toggleMusic(){
let p=document.getElementById('player');
if(!p.src){alert('Load MP3 first!');return;}
if(!musicOn){p.play();}else{p.pause();}
musicOn=!musicOn;
document.getElementById('musicBtn').innerText=musicOn?'🎵 MUSIC: ON':'🎵 MUSIC: OFF';
document.getElementById('musicBtn').className=musicOn?'btn gold':'btn gray';
document.getElementById('mode').innerText=voiceOn?(musicOn?'VOICE+MUSIC':'VOICE MODE'):'MUSIC ONLY';
}

function goLive(){document.getElementById('status').innerText='🔴 LIVE STEREO - Listeners can join now!';document.getElementById('goBtn').style.display='none';document.getElementById('stopBtn').style.display='inline-block';}
function stopLive(){location.reload();}
</script>
</body>
</html>
