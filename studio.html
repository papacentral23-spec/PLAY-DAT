<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PLAY-DAT STUDIO - WORKING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:1.5vw}
.top{background:#e0c36a;color:#000;padding:9px;font-weight:900;font-size:15px}
.sub{color:#e0c36a;font-size:10px;letter-spacing:2px;margin:4px}
.box{max-width:650px;margin:8px auto;background:#151515;border:1px solid #e0c36a;border-radius:12px;padding:10px}
input{padding:9px;border-radius:8px;border:0;font-size:14px;text-align:center;font-weight:900;width:75%}
.btn{background:#e0c36a;color:#000;padding:10px 20px;border:0;border-radius:20px;font-weight:900;margin:5px;cursor:pointer}
.btn.red{background:#ff2222;color:#fff;width:90%;padding:13px}
.btn.active{background:#00ff00!important;color:#000!important}
.videoWrap{position:relative;width:100%;background:#000;border-radius:8px;overflow:hidden;border:1px solid #333}
.videoWrap iframe{width:100%;height:260px;border:0;display:block}
.coverTop{position:absolute;left:0;top:0;background:#000;color:#e0c36a;padding:4px 9px;font-weight:900;font-size:11px;z-index:10;border-radius:0 0 8px 0}
.coverYT{position:absolute;right:0;bottom:36px;background:#000;color:#e0c36a;padding:8px 16px;font-weight:900;font-size:12px;z-index:30;border-radius:8px 0 0 0}
audio{width:100%}
video{width:100%;background:#000;border-radius:8px}
.range{width:100%;accent-color:#e0c36a;height:24px}
#status{color:#0f0;font-weight:900;font-size:12px;margin:5px}
</style>
</head>
<body>
<div class="top">PLAY-DAT WORLD</div>
<div class="sub">PLAY-DAT - DJ CONTROL ONLY</div>
<div id="status">✅ STUDIO READY - ALL CONTROLS WORKING</div>

<div class="box">
<b style="color:#e0c36a">DECK A - PLAY-DAT VIDEO</b><br><br>
<input id="vidId" value="id7JOjDMmEI">
<button class="btn" onclick="loadA()">LOAD</button>
<div class="videoWrap">
<div class="coverTop">PLAY-DAT ● LIVE</div>
<iframe id="deckA" src="https://www.youtube.com/embed/id7JOjDMmEI?rel=0&modestbranding=1&showinfo=0&controls=0" allow="autoplay;encrypted-media" allowfullscreen></iframe>
<div class="coverYT">▶ PLAY-DAT</div>
</div>
<div>Vol A <span id="volAVal">120%</span></div>
<input type="range" class="range" id="volA" min="0" max="200" value="120" oninput="updateAudio()">
</div>

<div class="box">
<b style="color:#e0c36a">DECK B - VOICE / ALHA-01</b><br><br>
<audio id="deckB" controls src="ALHA-01.mp3"></audio>
<button class="btn" id="micBtn" onclick="toggleMic()">🎤 MIC ON</button>
<div>Vol B <span id="volBVal">120%</span></div>
<input type="range" class="range" id="volB" min="0" max="200" value="120" oninput="updateAudio()">
</div>

<div class="box"><b style="color:#e0c36a">Crossfader A ↔ B</b><br>
<input type="range" class="range" id="cross" min="0" max="100" value="50" oninput="updateAudio()"><br>
<span id="crossVal">A 50% / B 50%</span><br>
MASTER LOUD <span id="masterVal">120%</span><br>
<input type="range" class="range" id="master" min="0" max="200" value="120" oninput="updateAudio()"></div>

<div class="box">
<button class="btn active" id="warmBtn" onclick="toggleWarm()">ANALOG WARMTH: ON</button>
<button class="btn" id="loudBtn" onclick="toggleLoud()">LOUD: NORMAL</button>
</div>

<div class="box"><b style="color:#e0c36a">🔴 RECORDING</b><br><span id="recTime">00:00</span><br>
<button class="btn red" id="recBtn" onclick="toggleRec()">● REC - SAVE MP3</button>
<a id="downloadLink" style="display:none;color:#0f0;font-weight:900">⬇ DOWNLOAD RECORDING</a>
</div>

<div class="box"><b style="color:#e0c36a">🎤 GUEST - RODE MIC + VIDEO</b><br>
<video id="gv" autoplay playsinline muted></video><br>
<button class="btn" id="guestBtn" onclick="connectGuest()">CONNECT GUEST</button>
<button class="btn" id="liveBtn" onclick="bringLive()">BRING LIVE</button>
</div>

<script>
let audioCtx=new (window.AudioContext||window.webkitAudioContext)();
let deckBEl=document.getElementById('deckB');
let srcB=audioCtx.createMediaElementSource(deckBEl);
let gainB=audioCtx.createGain(); let gainA=audioCtx.createGain();
let filter=audioCtx.createBiquadFilter(); filter.type='lowshelf'; filter.frequency.value=200; filter.gain.value=5;
let comp=audioCtx.createDynamicsCompressor();
let masterGain=audioCtx.createGain(); masterGain.gain.value=1.2;
srcB.connect(filter); filter.connect(gainB); gainB.connect(comp); comp.connect(masterGain); masterGain.connect(audioCtx.destination);
let micStream=null, micGain=null, warmOn=true, loudOn=false, rec=null, chunks=[], recStart=0, recTimer=null;

function updateAudio(){
 let vA=document.getElementById('volA').value/100;
 let vB=document.getElementById('volB').value/100;
 let cross=document.getElementById('cross').value/100;
 let master=document.getElementById('master').value/100;
 // Crossfader logic
 let aVol=vA*(1-cross); let bVol=vB*cross;
 // If cross 50 = both 50% - normal
 if(cross==0.5){aVol=vA*0.8; bVol=vB*0.8}
 gainB.gain.value=bVol*master;
 masterGain.gain.value=master;
 deckBEl.volume=Math.min(1,bVol);
 document.getElementById('volAVal').innerText=Math.round(vA*100)+'%';
 document.getElementById('volBVal').innerText=Math.round(vB*100)+'%';
 document.getElementById('masterVal').innerText=Math.round(master*100)+'%';
 document.getElementById('crossVal').innerText='A '+Math.round((1-cross)*100)+'% / B '+Math.round(cross*100)+'%';
 document.getElementById('status').innerText='✅ Vol A:'+Math.round(aVol*100)+'% Vol B:'+Math.round(bVol*100)+'% Master:'+Math.round(master*100)+'%';
 // YouTube volume via postMessage - works if YouTube API enabled
 let iframe=document.getElementById('deckA').contentWindow;
 if(iframe) iframe.postMessage(JSON.stringify({event:'command',func:'setVolume',args:[Math.round(aVol*100)]}),'*');
}

async function toggleMic(){
 let btn=document.getElementById('micBtn');
 try{
  if(!micStream){
   micStream=await navigator.mediaDevices.getUserMedia({audio:true});
   let micSrc=audioCtx.createMediaElementSource(new Audio()); // dummy
   let src=audioCtx.createMediaStreamSource(micStream);
   micGain=audioCtx.createGain(); micGain.gain.value=1.2;
   src.connect(micGain); micGain.connect(masterGain);
   btn.innerText='🎤 MIC LIVE - CLICK TO OFF'; btn.classList.add('active');
   document.getElementById('status').innerText='🎤 MIC LIVE - RODE MIC ON';
  }else{micStream.getTracks().forEach(t=>t.stop()); micStream=null; btn.innerText='🎤 MIC ON'; btn.classList.remove('active'); document.getElementById('status').innerText='🎤 MIC OFF';}
 }catch(e){alert('Allow MIC permission! '+e.message)}
}

function toggleWarm(){
 warmOn=!warmOn;
 let b=document.getElementById('warmBtn');
 if(warmOn){filter.gain.value=5; b.innerText='ANALOG WARMTH: ON'; b.classList.add('active')}
 else{filter.gain.value=0; b.innerText='ANALOG WARMTH: OFF'; b.classList.remove('active')}
 document.getElementById('status').innerText=warmOn?'🔥 WARMTH ON - Analog sound':'❄ WARMTH OFF - Clean';
}

function toggleLoud(){
 loudOn=!loudOn;
 let b=document.getElementById('loudBtn');
 if(loudOn){comp.threshold.value=-20; comp.ratio.value=12; masterGain.gain.value=1.6; b.innerText='LOUD: MAX'; b.classList.add('active')}
 else{comp.threshold.value=-24; comp.ratio.value=4; masterGain.gain.value=1.2; b.innerText='LOUD: NORMAL'; b.classList.remove('active')}
 document.getElementById('status').innerText=loudOn?'🔊 LOUD MAX - Compressor ON':'🔊 LOUD NORMAL';
}

function toggleRec(){
 let btn=document.getElementById('recBtn');
 if(!rec){
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
   rec=new MediaRecorder(stream); chunks=[];
   rec.ondataavailable=e=>chunks.push(e.data);
   rec.onstop=()=>{
    let blob=new Blob(chunks,{type:'audio/webm'});
    let url=URL.createObjectURL(blob);
    let a=document.getElementById('downloadLink'); a.href=url; a.download='PLAY-DAT-Recording.webm'; a.style.display='block';
   };
   rec.start(); recStart=Date.now();
   recTimer=setInterval(()=>{let s=Math.floor((Date.now()-recStart)/1000); document.getElementById('recTime').innerText='🔴 REC '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);
   btn.innerText='■ STOP REC'; btn.style.background='#000';
   document.getElementById('status').innerText='🔴 RECORDING LIVE...';
  });
 }else{rec.stop(); clearInterval(recTimer); rec=null; btn.innerText='● REC - SAVE MP3'; btn.style.background='#ff2222'; document.getElementById('status').innerText='✅ RECORDING SAVED - CLICK DOWNLOAD';}
}

async function connectGuest(){
 try{
  let stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  document.getElementById('gv').srcObject=stream;
  document.getElementById('guestBtn').innerText='✅ GUEST CONNECTED'; document.getElementById('guestBtn').classList.add('active');
  document.getElementById('status').innerText='🎥 GUEST CAMERA CONNECTED';
 }catch(e){alert('Allow camera! '+e.message)}
}

function bringLive(){
 let v=document.getElementById('gv');
 if(v.srcObject){v.muted=false; document.getElementById('liveBtn').innerText='🔴 GUEST LIVE ON AIR'; document.getElementById('liveBtn').classList.add('active'); document.getElementById('status').innerText='🔴 GUEST LIVE ON AIR!';}
 else{alert('First CONNECT GUEST!')}
}

function loadA(){let id=document.getElementById('vidId').value;document.getElementById('deckA').src='https://www.youtube.com/embed/'+id+'?enablejsapi=1&rel=0&modestbranding=1&showinfo=0&controls=0&autoplay=1'; document.getElementById('status').innerText='▶ LOADING VIDEO '+id}

updateAudio();
</script>
</body>
</html>
