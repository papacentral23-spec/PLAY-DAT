<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT STUDIO - KUMASI</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.top{background:#111;padding:10px;display:flex;justify-content:space-between;border-bottom:2px solid gold}
.on{background:gold;color:#000;padding:8px 14px;border-radius:20px;border:none;font-weight:bold}
.off{background:#222;color:#fff;padding:8px 14px;border-radius:20px;border:1px solid #444}
.stage{background:#000;border:2px solid #333;margin:10px;border-radius:12px;height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
.panel{background:#111;margin:10px;border-radius:12px;padding:12px;border:1px solid #222}
.btn{padding:10px 14px;border:none;border-radius:8px;margin:4px;font-weight:bold}
.gold{background:gold;color:#000}.red{background:red;color:#fff}.grey{background:#222;color:#fff}
</style></head><body>

<div class="top">
<div style="color:gold;font-weight:bold">👑 PLAY DAT STUDIO</div>
<div>
<button id="vB" class="on" onclick="mode('voice')">🎙️ VOICE</button>
<button id="vdB" class="off" onclick="mode('video')">📹 VIDEO</button>
</div>
<div><span id="dot" style="background:#555;padding:4px 10px;border-radius:12px;font-size:11px">● OFFLINE</span></div>
</div>

<div class="stage" id="stage">
<video id="cam" autoplay muted playsinline style="display:none"></video>
<div id="voiceArt" style="text-align:center"><div style="font-size:60px">🎙️</div><div style="color:gold;font-weight:bold">VOICE MODE</div><div style="font-size:11px;color:#777">Listeners hear MP3 + Mic - No Video</div></div>
</div>

<div class="panel">
Host ID: <input id="hid" value="PLAYDAT-KUMASI" style="background:#000;color:gold;border:1px solid #555;padding:6px;border-radius:6px;width:140px">
<button class="btn grey" onclick="start()">START</button>
<button id="liveBtn" class="btn red" onclick="golive()">🔴 GO LIVE</button>
<span id="cnt" style="font-size:12px;color:#0f0;margin-left:8px">0 listeners</span>

<div style="margin-top:12px">
<button class="btn grey" onclick="micT()">🎤 Mic ON/OFF</button>
<button class="btn gold" onclick="document.getElementById('mp3').click()">🎵 Play MP3</button>
<input type="file" id="mp3" accept="audio/*" hidden onchange="playMp3(this)">
</div>

<audio id="aud" controls style="width:100%;margin-top:8px;display:none"></audio>
<div id="guests" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"></div>

<div style="margin-top:10px;background:#000;padding:8px;border-radius:8px;border:1px dashed #333;font-size:11px">
Listener Link (share to fans):<br>
<b id="llink" style="color:gold">Start first...</b>
</div>
</div>

<script>
let micS, camS, peer, live=false, count=0, modeNow='voice', mixedStream;
function mode(m){
 modeNow=m;
 document.getElementById('vB').className=m=='voice'?'on':'off';
 document.getElementById('vdB').className=m=='video'?'on':'off';
 let cam=document.getElementById('cam'), art=document.getElementById('voiceArt');
 if(m=='video'){
  art.style.display='none'; cam.style.display='block';
  navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=>{camS=s; cam.srcObject=s; if(peer) peer.call?null:null;});
 }else{
  art.style.display='block'; cam.style.display='none';
  if(camS) camS.getVideoTracks().forEach(t=>t.stop());
 }
}

function micT(){ if(micS) micS.getAudioTracks()[0].enabled=!micS.getAudioTracks()[0].enabled; alert('Mic '+(micS.getAudioTracks()[0].enabled?'ON':'OFF')); }

function playMp3(inp){
 let f=inp.files[0]; if(!f) return;
 let a=document.getElementById('aud'); a.src=URL.createObjectURL(f); a.style.display='block'; a.play();
 if(micS){
  // Mix mic + mp3 for listeners
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const micSrc=ctx.createMediaStreamSource(micS);
  const audSrc=ctx.createMediaElementSource(a);
  const dest=ctx.createMediaStreamDestination();
  micSrc.connect(dest); audSrc.connect(dest);
  mixedStream=dest.stream;
  if(modeNow=='video' && camS){
   camS.getAudioTracks().forEach(t=>camS.removeTrack(t));
   dest.stream.getAudioTracks().forEach(t=>camS.addTrack(t));
   mixedStream=camS;
  } else {
   mixedStream=dest.stream;
   if(modeNow=='video' && camS) dest.stream.getVideoTracks().forEach(t=>mixedStream.addTrack(t));
  }
 }
}

async function start(){
 let id=document.getElementById('hid').value.trim();
 micS=await navigator.mediaDevices.getUserMedia({audio:true});
 peer=new Peer(id);
 peer.on('open',()=>{
  document.getElementById('dot').innerText='● READY'; document.getElementById('dot').style.background='orange';
  document.getElementById('llink').innerText=location.origin+location.pathname.replace(/[^\/]+$/,'')+'listener.html?host='+id;
 });
 peer.on('call',async c=>{
  count++; document.getElementById('cnt').innerText=count+' listeners';
  let streamToSend = modeNow=='video'? (camS || micS) : (mixedStream || micS);
  c.answer(streamToSend);
 });
}

function golive(){
 live=!live;
 document.getElementById('liveBtn').innerText=live?'⏹️ STOP LIVE':'🔴 GO LIVE';
 document.getElementById('dot').innerText=live?'● LIVE':'● READY';
 document.getElementById('dot').style.background=live?'red':'orange';
 if(live) alert('YOU ARE LIVE! Now open listener and tap PLAY RADIO - they will hear you!');
}
mode('voice');
</script></body></html>
