<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUDIO PLAY DAT- MUSIC

</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;text-align:center}
.top{background:#D4AF37;color:#000;padding:12px;font-weight:900}
.card{background:#111;border:2px solid #D4AF37;border-radius:15px;margin:8px;padding:10px}
button{padding:8px 12px;border-radius:20px;border:none;font-weight:bold;margin:3px;font-size:12px}
.on{background:#0f0;color:#000}.off{background:#333;color:#fff}
.recOn{background:red;color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.5}}
#chatBox{height:130px;overflow-y:auto;background:#000;border:1px solid #444;border-radius:10px;padding:6px;text-align:left;font-size:12px;margin-top:8px}
.msg{margin:3px 0;padding:4px 8px;border-radius:10px;background:#222}
.msg b{color:#FFD700}
input{width:65%;padding:8px;border-radius:20px;border:1px solid #D4AF37;background:#222;color:#fff}
</style>
</head>
<body>
<div class="top">👑 STUDIO- MUSIC  <span style="background:red;color:#fff;padding:2px 6px;border-radius:10px;font-size:10px">● LIVE</span></div>

<div class="card">
<h3 style="color:#FFD700;margin:4px">🎙️ STUDIO CONTROL</h3>
<p id="idBox" style="font-size:10px;color:#888">ID: Loading...</p>

<button id="micBtn" class="off" onclick="toggleMic()">🎙️ MIC OFF</button>
<button id="musicBtn" class="off" onclick="playMusic()">🎵 MUSIC TO ALL</button>
<button id="guestBtn" class="off" onclick="toggleGuest()">👥 WAIT GUEST</button>
<button id="recBtn" class="off" onclick="toggleRec()">🔴 REC OFF</button>

<audio id="myAudio" controls crossorigin="anonymous" style="width:100%;margin-top:6px"></audio>
<audio id="guestAudio" controls autoplay style="width:100%;display:none;margin-top:4px"></audio>

<p id="status" style="font-size:11px;color:#0f0;margin:4px">Ready - Use CHROME</p>
<p id="count" style="font-size:11px;color:#D4AF37;margin:2px">Listeners: 0 | Guest: No</p>

<div id="chatBox"></div>
<div style="display:flex;gap:4px;margin-top:6px;justify-content:center">
<input id="chatInput" placeholder="Type to all listeners...">
<button class="on" onclick="sendChat()" style="padding:8px 14px">SEND</button>
</div>

<a id="downloadLink" style="display:none;color:#0f0;font-size:12px;margin-top:6px">⬇️ DOWNLOAD RECORDING</a>
</div>

<script>
let peer, myStream, guestConn, listenerCount=0, conns=[];
let micOn=false, guestOn=false, musicMode=false;
let recorder, recChunks=[], isRec=false;
let audioEl = null;

peer = new Peer('PLAY-DAT-STUDIO-14', {config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
peer.on('open', id=>{
 document.getElementById('idBox').innerText='STUDIO ID: '+id;
 addChat('System','Studio V8 Live! ID: '+id);
 audioEl = document.getElementById('myAudio');
});

peer.on('connection', c=>{
 conns.push(c); listenerCount++;
 updateCount();
 c.on('data', d=>{ if(d.type=='chat') addChat(d.name||'Listener', d.text); });
 c.on('close', ()=>{listenerCount--; updateCount();});
});

function updateCount(){ document.getElementById('count').innerText='Listeners: '+listenerCount+' | Guest: '+(guestOn?'YES':'No'); }

peer.on('call', async call=>{
 if(call.metadata && call.metadata.type=='guest'){
  if(!myStream) myStream=await navigator.mediaDevices.getUserMedia({audio:true});
  call.answer(myStream);
  call.on('stream', s=>{
   document.getElementById('guestAudio').style.display='block';
   document.getElementById('guestAudio').srcObject=s;
   guestOn=true; updateCount();
   addChat('System','🎙️ Guest Joined Live!');
  });
  guestConn=call;
 } else {
  if(!myStream) myStream=await navigator.mediaDevices.getUserMedia({audio:true});
  // If music mode, send music, else mic
  let sendStream = musicMode && audioEl.captureStream? audioEl.captureStream() : myStream;
  call.answer(sendStream);
 }
});

async function toggleMic(){
 if(!micOn){
  myStream=await navigator.mediaDevices.getUserMedia({audio:true});
  audioEl.srcObject=myStream; audioEl.play();
  document.getElementById('micBtn').innerText='🎙️ MIC ON'; document.getElementById('micBtn').className='on';
  micOn=true; musicMode=false;
  sendTrackToAll(myStream.getAudioTracks()[0]);
  addChat('System','🎙️ Mic Live to All');
 } else {
  if(myStream) myStream.getTracks().forEach(t=>t.stop());
  document.getElementById('micBtn').innerText='🎙️ MIC OFF'; document.getElementById('micBtn').className='off';
  micOn=false;
 }
}

function playMusic(){
 audioEl = document.getElementById('myAudio');
 audioEl.srcObject=null;
 audioEl.src='ALHA-01.mp3';
 audioEl.play().then(()=>{
   addChat('System','🎵 Music Playing to ALL Listeners!');
   document.getElementById('musicBtn').innerText='🎵 MUSIC ON'; document.getElementById('musicBtn').className='on';
   document.getElementById('status').innerText='Music Streaming to Listeners';
   musicMode=true;
   // Get music track
   let stream = audioEl.captureStream? audioEl.captureStream() : audioEl.mozCaptureStream();
   if(stream){
     let track = stream.getAudioTracks()[0];
     sendTrackToAll(track);
   }
 }).catch(e=>{
   addChat('System','⚠️ Upload ALHA-01.mp3 to GitHub first!');
 });

 audioEl.onended = ()=>{
   document.getElementById('musicBtn').innerText='🎵 MUSIC TO ALL'; document.getElementById('musicBtn').className='off';
   musicMode=false;
   if(myStream && micOn){
     sendTrackToAll(myStream.getAudioTracks()[0]);
     addChat('System','Music ended - Back to Mic');
   }
 };
}

function sendTrackToAll(track){
 for(let id in peer.connections){
   peer.connections[id].forEach(conn=>{
     if(conn.peerConnection){
       let senders = conn.peerConnection.getSenders();
       senders.forEach(s=>{
         if(s.track && s.track.kind=='audio'){
           s.replaceTrack(track);
         }
       });
     }
   });
 }
}

function toggleGuest(){
 let btn=document.getElementById('guestBtn');
 if(!guestOn){btn.innerText='👥 WAIT GUEST';btn.className='on';}
 else {if(guestConn)guestConn.close();btn.innerText='👥 WAIT GUEST';btn.className='off';guestOn=false; updateCount();}
}

function addChat(name,text){
 let box=document.getElementById('chatBox');
 let div=document.createElement('div'); div.className='msg';
 div.innerHTML='<b>'+name+':</b> '+text;
 box.appendChild(div); box.scrollTop=box.scrollHeight;
}
function sendChat(){
 let inp=document.getElementById('chatInput'); if(!inp.value)return;
 let txt=inp.value; addChat('DJ',txt);
 conns.forEach(c=>{try{c.send({type:'chat',name:'DJ',text:txt})}catch{}});
 inp.value='';
}
function toggleRec(){
 let btn=document.getElementById('recBtn');
 if(!isRec){
  if(!myStream &&!musicMode){alert('Turn MIC ON or Play MUSIC first');return}
  let recStream = musicMode && audioEl.captureStream? audioEl.captureStream() : myStream;
  recChunks=[]; recorder=new MediaRecorder(recStream);
  recorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data)};
  recorder.onstop=()=>{
   let blob=new Blob(recChunks,{type:'audio/webm'});
   let url=URL.createObjectURL(blob);
   let a=document.getElementById('downloadLink');
   a.href=url; a.download='PLAY-DAT-Show-'+Date.now()+'.webm';
   a.style.display='block'; a.innerText='⬇️ DOWNLOAD SHOW ('+Math.round(blob.size/1000)+'KB)';
  };
  recorder.start(); btn.innerText='🔴 REC ON'; btn.className='recOn'; isRec=true;
  addChat('System','🔴 Recording Started');
 } else {
  recorder.stop(); btn.innerText='🔴 REC OFF'; btn.className='off'; isRec=false;
  addChat('System','⏹️ Recording Saved');
 }
}
</script>
</body>
</html>
