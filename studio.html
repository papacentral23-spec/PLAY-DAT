<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT STUDIO - MAIN</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial;margin:0}
.top{background:#D4AF37;color:#000;padding:12px;font-weight:900}
.card{background:#111;border:2px solid #D4AF37;border-radius:15px;margin:10px;padding:12px}
button{padding:10px 15px;border-radius:20px;border:none;font-weight:bold;margin:4px}
.on{background:#0f0;color:#000}.off{background:#333;color:#fff}
.live{background:red;color:#fff;padding:3px 8px;border-radius:10px;font-size:11px}
#guestAudio{width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="top">👑 STUDIO MAIN - PLAY DAT <span class="live">● LIVE</span></div>

<div class="card">
<h3 style="color:#FFD700;margin:5px">🎙️ STUDIO CONTROL</h3>
<p id="idBox" style="font-size:11px;color:#888">ID: Loading...</p>

<button id="micBtn" class="off" onclick="toggleMic()">🎙️ MIC OFF</button>
<button class="off" onclick="playMusic()">🎵 PLAY MUSIC</button>
<button id="guestBtn" class="off" onclick="toggleGuest()">👥 GUEST OFF</button>

<audio id="myAudio" controls style="width:100%;margin-top:10px"></audio>
<audio id="guestAudio" controls autoplay style="display:none"></audio>

<p id="status" style="font-size:11px;color:#0f0">Ready - Waiting for listeners</p>
<p id="count" style="font-size:12px;color:#D4AF37">Listeners: 0 | Guest: No</p>

<p style="font-size:10px;color:#555">Share listener link: papacentral23-spec.github.io/PLAY-DAT/listener.html</p>
</div>

<script>
let peer, myStream, guestConn, listenerCount=0;
let micOn=false, guestOn=false;

peer = new Peer('PLAY-DAT-STUDIO-'+Math.floor(Math.random()*100), {config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});

peer.on('open', id=>{
 document.getElementById('idBox').innerText='STUDIO ID: '+id+' - Share to guest';
 document.getElementById('status').innerText='✅ STUDIO LIVE - Ready for guest & listeners';
});

peer.on('connection', c=>{
 listenerCount++;
 document.getElementById('count').innerText='Listeners: '+listenerCount+' | Guest: '+(guestOn?'Yes':'No');
});

peer.on('call', async call=>{
 if(call.metadata && call.metadata.type=='guest'){
  // Guest calling
  if(!myStream) myStream=await navigator.mediaDevices.getUserMedia({audio:true});
  call.answer(myStream);
  call.on('stream', s=>{
   document.getElementById('guestAudio').style.display='block';
   document.getElementById('guestAudio').srcObject=s;
   guestOn=true;
   document.getElementById('count').innerText='Listeners: '+listenerCount+' | Guest: YES LIVE';
   document.getElementById('status').innerText='🎙️ GUEST LIVE ON AIR!';
  });
  guestConn=call;
 } else {
  // Listener
  if(!myStream) myStream=await navigator.mediaDevices.getUserMedia({audio:true});
  call.answer(myStream);
  listenerCount++;
  document.getElementById('count').innerText='Listeners: '+listenerCount+' | Guest: '+(guestOn?'Yes':'No');
 }
});

async function toggleMic(){
 if(!micOn){
  myStream=await navigator.mediaDevices.getUserMedia({audio:true});
  document.getElementById('myAudio').srcObject=myStream;
  document.getElementById('micBtn').innerText='🎙️ MIC ON';
  document.getElementById('micBtn').className='on';
  micOn=true;
  document.getElementById('status').innerText='🎙️ MIC LIVE - Talking to all listeners';
 } else {
  myStream.getTracks().forEach(t=>t.stop());
  document.getElementById('micBtn').innerText='🎙️ MIC OFF';
  document.getElementById('micBtn').className='off';
  micOn=false;
 }
}

function playMusic(){
 let au=document.getElementById('myAudio');
 au.src='ALHA-01.mp3';
 au.play();
 document.getElementById('status').innerText='🎵 MUSIC PLAYING TO LISTENERS';
}

function toggleGuest(){
 let btn=document.getElementById('guestBtn');
 if(!guestOn){
  btn.innerText='👥 GUEST ON - Waiting';
  btn.className='on';
  document.getElementById('status').innerText='👥 Waiting for guest to call... Tell guest your ID';
 } else {
  if(guestConn) guestConn.close();
  btn.innerText='👥 GUEST OFF';
  btn.className='off';
  guestOn=false;
  document.getElementById('guestAudio').style.display='none';
 }
}
</script>
</body>
</html>
