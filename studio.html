<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT STUDIO - </title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;text-align:center}
.top{background:linear-gradient(90deg,gold,orange);color:#000;padding:12px;font-weight:bold;display:flex;justify-content:space-between}
.box{background:#151515;margin:10px;padding:14px;border-radius:14px;border:1px solid #333}
input{padding:12px;border-radius:8px;border:1px solid gold;background:#000;color:#fff;width:60%;font-size:16px}
.btn{padding:12px 20px;border:none;border-radius:25px;font-weight:bold;margin:5px;font-size:14px}
.gold{background:gold;color:#000}.green{background:#0f0;color:#000}.red{background:red;color:#fff}.blue{background:#0af;color:#fff}.gray{background:#555;color:#fff}
video{width:100%;max-height:200px;background:#000;border-radius:12px}
.row{display:flex;justify-content:space-around;margin:10px 0}
</style></head><body>
<div class="top"><span>👑 PLAY DAT STUDIO</span><span id="dot">⚫ OFFLINE</span></div>

<div class="box">
<input id="hostId" value="PLAYDAT999" placeholder="Your ID">
<button class="btn gold" onclick="startStudio()">START</button><br>
<span id="stat" style="color:#aaa;font-size:12px">Type ID → START</span><br><br>
<button class="btn green" id="goBtn" onclick="goLive()" style="display:none">🔴 GO LIVE</button>
<button class="btn red" id="stopBtn" onclick="stopLive()" style="display:none">⏹️ STOP LIVE</button>
</div>

<div class="box">
<video id="localV" autoplay muted playsinline></video>
<div class="row">
<button class="btn blue" id="voiceBtn" onclick="toggleVoice()">🎤 VOICE: ON</button>
<button class="btn gray" id="musicBtn" onclick="toggleMusic()">🎵 MUSIC: OFF</button>
</div>
<div style="font-size:13px">👥 <span id="cnt">0</span> listeners | <span id="mode">VOICE MODE</span> | <span id="micStat">Mic OFF</span></div>
<audio id="mp3Player" controls style="width:100%;margin-top:10px"></audio>
<input type="file" id="mp3File" accept="audio/*" style="margin-top:6px;width:90%">
</div>

<script>
let peer, myStream, mp3Stream, audioCtx, connections=[];
let voiceOn=true, musicOn=false, voiceTrack, combinedStream;

async function startStudio(){
 try{
  myStream=await navigator.mediaDevices.getUserMedia({
    video:{width:640,height:360},
    audio:{channelCount:2,echoCancellation:false,autoGainControl:false,noiseSuppression:false,sampleRate:48000}
  });
  document.getElementById('localV').srcObject=myStream;
  document.getElementById('micStat').innerText='STEREO ON';
  voiceTrack=myStream.getAudioTracks()[0];

  document.getElementById('mp3File').addEventListener('change',e=>{
    let file=e.target.files[0]; if(!file) return;
    let url=URL.createObjectURL(file);
    let player=document.getElementById('mp3Player'); player.src=url;
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    let source=audioCtx.createMediaElementSource(player);
    let dest=audioCtx.createMediaStreamDestination();
    source.connect(dest); source.connect(audioCtx.destination);
    mp3Stream=dest.stream;
  });

  peer=new Peer(document.getElementById('hostId').value.trim()||'PLAYDAT999');
  peer.on('open',()=>{
    document.getElementById('dot').innerText='🟠 READY';
    document.getElementById('stat').innerText='✅ TAP GO LIVE';
    document.getElementById('goBtn').style.display='inline-block';
  });
  peer.on('call',call=>{
    updateStream();
    call.answer(combinedStream||myStream);
    connections.push(call);
    document.getElementById('cnt').innerText=connections.length;
  });
  peer.on('error',e=>{document.getElementById('stat').innerText='ID Taken! Use different ID';});
 }catch(err){document.getElementById('stat').innerText='Mic Error: '+err.message}
}

function updateStream(){
 let tracks=[];
 if(voiceOn && voiceTrack) tracks.push(voiceTrack);
 if(musicOn && mp3Stream) tracks=tracks.concat(mp3Stream.getAudioTracks());
 combinedStream=new MediaStream([...myStream.getVideoTracks(),...tracks]);
 connections.forEach(c=>{
   try{let s=c.peerConnection.getSenders().find(x=>x.track&&x.track.kind==='audio'); if(s) s.replaceTrack(tracks[0]||null);}catch(e){}
 });
}

function toggleVoice(){
 voiceOn=!voiceOn;
 document.getElementById('voiceBtn').innerText=voiceOn?'🎤 VOICE: ON':'🔇 VOICE: OFF';
 document.getElementById('voiceBtn').className=voiceOn?'btn blue':'btn gray';
 updateStream();
 document.getElementById('mode').innerText=voiceOn?(musicOn?'VOICE + MUSIC':'VOICE MODE'):'MUSIC ONLY';
}

function toggleMusic(){
 let p=document.getElementById('mp3Player');
 if(!p.src){alert('Load MP3 first! Choose file below');return;}
 if(!musicOn){p.play();} else {p.pause();}
 musicOn=!musicOn;
 document.getElementById('musicBtn').innerText=musicOn?'🎵 MUSIC: ON':'🎵 MUSIC: OFF';
 document.getElementById('musicBtn').className=musicOn?'btn gold':'btn gray';
 updateStream();
 document.getElementById('mode').innerText=voiceOn?(musicOn?'VOICE + MUSIC':'VOICE MODE'):'MUSIC ONLY';
}

function goLive(){
 document.getElementById('dot').innerText='🔴 LIVE STEREO';
 document.getElementById('stat').innerText='🔴 LIVE NOW - LISTENERS CAN JOIN!';
 document.getElementById('goBtn').style.display='none';
 document.getElementById('stopBtn').style.display='inline-block';
}
function stopLive(){location.reload();}
</script></body></html>
