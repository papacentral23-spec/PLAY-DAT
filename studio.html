<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY-DAT STUDIO</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>body{background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:10px}button{padding:14px;margin:5px;border-radius:10px;border:0;font-weight:900}video{width:100%;max-width:500px;border:3px solid red;border-radius:12px;background:#000}iframe{width:100%;height:280px;border:3px solid #facc15;border-radius:12px}input{padding:12px;width:90%;margin:5px}</style></head><body>
<h1>🎧 PLAY-DAT STUDIO LIVE</h1><h3 id="status">⚪ OFFLINE</h3>
<video id="myCam" autoplay muted playsinline></video><br>
<button style="background:red;color:#fff;font-size:18px" onclick="goLive()">🔴 GO LIVE</button><br>
<button style="background:#00ff00;color:#000;padding:20px;width:95%;font-size:20px" onclick="forceVoice()">🎤 VOICE MODE</button><p id="voiceStatus">MIC OFF</p>
<h2>📺 DECK A - ARM BALL</h2><input id="ytid" value="id7JOjDMmEI" style="width:70%"><button onclick="loadYT()">LOAD</button><br>
<iframe id="yt" src="https://www.youtube.com/embed/id7JOjDMmEI?autoplay=1&mute=0"></iframe>
<h2>🎵 DECK B - PLAY MP3 FROM PHONE</h2>
<input type="file" id="filePick" accept="audio/*" onchange="pickFile(event)" style="background:#fff;color:#000;border-radius:10px">
<p>📂 Pick ALHA-01.mp3 or any song from your phone</p>
<audio id="player" controls style="width:100%"></audio><br>
<button style="background:#facc15;padding:18px;width:95%;font-size:18px" onclick="playMP3()">▶ PLAY MP3 TO LISTENER</button>
<button style="background:#fff;padding:12px;width:95%" onclick="document.getElementById('player').pause()">⏸ PAUSE</button>
<p>MP3: <b id="mp3status">NO FILE PICKED - TAP CHOOSE FILE</b> | 👥 <b id="count">0</b></p>
<p id="fileName">No file yet</p>
<script>
let peer,audioCtx,dest,player=document.getElementById('player'),micStream;
function pickFile(e){let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);player.src=url;document.getElementById('fileName').innerText='✅ '+f.name+' - READY!';document.getElementById('mp3status').innerText='READY - PRESS PLAY';player.play();}
async function goLive(){
 document.getElementById('status').innerHTML='🔴 LIVE - WAIT';
 try{let cs=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('myCam').srcObject=cs;micStream=cs;}catch(e){micStream=await navigator.mediaDevices.getUserMedia({audio:true});}
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();dest=audioCtx.createMediaStreamDestination();
 let m=audioCtx.createMediaStreamSource(micStream);let mg=audioCtx.createGain();mg.gain.value=2;m.connect(mg);mg.connect(dest);window.micGain=mg;
 if(player.src){let ps=audioCtx.createMediaElementSource(player);let pg=audioCtx.createGain();pg.gain.value=1;ps.connect(pg);pg.connect(dest);pg.connect(audioCtx.destination);}
 player.volume=1;player.play();document.getElementById('mp3status').innerText='🔊 PLAYING TO LISTENER';
 peer=new Peer('PLAY-DAT-LIVE-1');peer.on('open',id=>document.getElementById('status').innerHTML='🔴 LIVE - '+id);
 peer.on('call',call=>{call.answer(dest.stream);let c=parseInt(document.getElementById('count').innerText)+1;document.getElementById('count').innerText=c;});
 document.getElementById('voiceStatus').innerText='🎤 VOICE ON';
}
function playMP3(){if(!player.src){alert('Pick file first! Tap CHOOSE FILE');return;}player.volume=1;player.play();if(audioCtx)audioCtx.resume();document.getElementById('mp3status').innerText='🔊 PLAYING TO LISTENER';}
function forceVoice(){if(micStream)micStream.getAudioTracks().forEach(t=>t.enabled=true);if(window.micGain)window.micGain.gain.value=2;}
function loadYT(){let v=document.getElementById('ytid').value.trim();if(v.includes('youtu.be/'))v=v.split('youtu.be/')[1].split('?')[0];if(v.includes('v='))v=v.split('v=')[1].split('&')[0];document.getElementById('yt').src='https://www.youtube.com/embed/'+v+'?autoplay=1&mute=0';document.getElementById('ytid').value=v;}
</script></body></html>
