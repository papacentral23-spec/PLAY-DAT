<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD5 EASY ADD MP3</title>
<style>
body{margin:0;background:#080600;color:#fff;font-family:system-ui;padding:20px;text-align:center}
h1{color:#FFD700;font-size:32px;margin:10px;text-shadow:0 0 15px #FFD70077}
p{color:#8a7a40}
.card{background:#151300;border:1px solid #3a3300;border-radius:20px;padding:20px;max-width:420px;margin:20px auto;box-shadow:0 0 30px #FFD70022}
input{width:100%;padding:16px;background:#1e1a00;border:1px solid #3a3300;border-radius:12px;color:#FFD700;margin:10px 0;font-size:16px}
.btn{width:100%;padding:18px;border:none;border-radius:14px;font-weight:900;font-size:16px;margin:10px 0;cursor:pointer}
.btn-gold{background:linear-gradient(180deg,#FFD700,#D4AF37);color:#000;box-shadow:0 4px 20px #FFD70066}
.btn-dark{background:#111;color:#FFD700;border:2px solid #FFD700}
#status{color:#FFD700;margin:10px;font-weight:700}
</style></head><body>
<h1>🎵 EASY ADD MP3</h1>
<p style="color:#FFD700">GOLD5 EDITION - No code! Just add songs!</p>
<div class="card">
<input type="file" id="file" accept="audio/*,.mp3">
<input type="text" id="title" placeholder="Song Title e.g. ALHA-02 GOLD5">
<div id="status">Ready to add Gold song...</div>
<button class="btn btn-gold" onclick="addSong()">+ ADD TO PLAY DAT RADIO GOLD5</button>
<button class="btn btn-dark" onclick="location.href='index.html'">← BACK TO GOLD RADIO</button>
<div id="list" style="margin-top:15px;text-align:left"></div>
</div>
<script>
let songs=JSON.parse(localStorage.getItem('playdat_gold5')||'[]');
let names=JSON.parse(localStorage.getItem('playdat_gold_names')||'{}');
function render(){document.getElementById('list').innerHTML=songs.map((u,i)=>`<div style="background:#1e1a00;padding:10px;border-radius:8px;margin:5px 0;border-left:3px solid #FFD700;display:flex;justify-content:space-between"><span style="color:#FFEC8B">${names[u]||u.split('/').pop()}</span><span style="color:#f55;cursor:pointer" onclick="songs.splice(${i},1);delete names['${u}'];localStorage.setItem('playdat_gold5',JSON.stringify(songs));localStorage.setItem('playdat_gold_names',JSON.stringify(names));render()">✕</span></div>`).join('');}
async function addSong(){
let f=document.getElementById('file').files[0];
let t=document.getElementById('title').value||(f?f.name:"");
if(!f){alert("Choose MP3 first!");return;}
document.getElementById('status').innerText="✅ Adding...";
let url=URL.createObjectURL(f);
songs.push(url); names[url]=t||f.name;
localStorage.setItem('playdat_gold5',JSON.stringify(songs));
localStorage.setItem('playdat_gold_names',JSON.stringify(names));
document.getElementById('status').innerText="👑 GOLD5 ADDED! "+(t||f.name)+" - Go to Radio!";
render();
}
render();
</script></body></html>
