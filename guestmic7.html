<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY DAT - Guest Mic</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1a1a1a;padding:25px;border-radius:15px;max-width:400px;width:100%;text-align:center;border:1px solid #333}
button{width:100%;padding:16px;background:#00ff88;color:#000;border:none;border-radius:50px;font-weight:900;margin-top:15px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#ffcc00">🎤 GUEST MIC 7</h2>
<p style="color:#888;font-size:13px;margin:10px 0">Join Papa Central Live</p>
<button onclick="join()">🎤 JOIN STUDIO AS GUEST</button>
<div id="status" style="margin-top:12px;font-size:12px;color:#888">Tap to join - allow mic</div>
<audio id="audio" autoplay playsinline style="display:none"></audio>
</div>
<script>
function join(){
 document.getElementById('status').innerText='Connecting...';
 navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
  const peer=new Peer({config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
  peer.on('open',()=>{
   const call=peer.call('playdat-studio-papa',stream,{metadata:{type:'guest'}});
   call.on('stream',remoteStream=>{
    document.getElementById('audio').srcObject=remoteStream;
    document.getElementById('status').innerText='✅ Connected to Studio! Papa can hear you';
    document.getElementById('status').style.color='#00ff88';
   });
  });
 });
}
</script>
</body>
</html>
