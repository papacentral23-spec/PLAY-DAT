<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO GUEST MIC V7 FINAL</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>body{margin:0;background:#0a0a0f;color:#fff;font-family:system-ui;text-align:center;padding:12px}header{padding:12px;border-bottom:3px solid #d4af37;position:sticky;top:0;background:#0a0a0f}.panel{margin:14px;padding:18px;background:linear-gradient(135deg,#1a1a1a,#2a2110);border:2px solid #d4af37;border-radius:16px}button{padding:14px 20px;margin:6px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;font-weight:800}button.gold{background:#d4af37;color:#000}.vu{display:flex;gap:2px;height:44px;background:#000;padding:4px}.b{flex:1;background:#d4af37;height:10%}input{padding:12px;width:80%;border-radius:10px;border:1px solid #555;background:#111;color:#fff;text-align:center;font-size:16px}#status{margin:14px;color:#aaa}</style></head><body>
<header>🎤 GUEST MIC V7 | <span id="cs">🟡 Connecting...</span></header><div class="vu" id="vu"></div>
<div class="panel"><div style="color:#d4af37;margin-bottom:8px">YOUR NAME</div><input id="gname" placeholder="e.g. MAZ from Kumasi"><br><br><button class="gold" onclick="requestMic()">🔴 REQUEST TO TALK</button><div id="status">Not requested yet</div><button id="micBtn" onclick="toggleMic()" style="display:none">🎤 MIC OFF</button><div style="font-size:11px;color:#777;margin-top:8px">When host accepts, your mic button appears - ABBEY ROAD warm!</div></div>
<script>
let vu=document.getElementById('vu');for(let i=0;i<18;i++){let d=document.createElement('div');d.className='b';vu.appendChild(d);}setInterval(()=>{for(let c of vu.children)c.style.height=(Math.random()*70+10)+'%';},130);
let brokers=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8000/mqtt'],idx=0,client=null,ms=null,ctx=null;
function tryConn(){if(idx>=brokers.length){document.getElementById('cs').textContent='🔴 Offline';return;}let c=mqtt.connect(brokers[idx],{keepalive:30,connectTimeout:5000});let to=setTimeout(()=>{try{c.end();}catch(e){}idx++;tryConn();},6000);c.on('connect',()=>{clearTimeout(to);client=c;document.getElementById('cs').textContent='🟢 CONNECTED';c.subscribe('sirdio/host/guest');c.on('message',(t,m)=>{if(m.toString()=='YES'){document.getElementById('status').innerHTML='✅ <b style=color:#0f0>HOST ACCEPTED! Talk now</b>';document.getElementById('micBtn').style.display='inline-block';}if(m.toString()=='NO'){document.getElementById('status').innerHTML='❌ Declined - try later';}});});c.on('error',()=>{clearTimeout(to);idx++;tryConn();});}tryConn();
function requestMic(){let n=document.getElementById('gname').value||'Guest';if(client&&client.connected){client.publish('sirdio/guest/request',n);document.getElementById('status').textContent='🟡 Request sent to DJ - waiting...';}else alert('Wait for 🟢 CONNECTED');}
async function toggleMic(){let b=document.getElementById('micBtn');if(ms){ms.getTracks().forEach(t=>t.stop());ms=null;b.textContent='🎤 MIC OFF';b.classList.remove('active');return;}try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,autoGainControl:false,noiseSuppression:false}});if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();let src=ctx.createMediaStreamSource(ms);let g=ctx.createGain();g.gain.value=1.2;src.connect(g);g.connect(ctx.destination);b.textContent='🔴 MIC ON - ABBEY ROAD 🔥';b.classList.add('active');}catch(e){alert(e.message);}}
</script></body></html>
