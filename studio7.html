<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY DAT GOLD5</title><style>*{box-sizing:border-box}body{margin:0;background:#080600;color:#fff;font-family:system-ui;padding:12px;text-align:center}h1{color:#FFD700;margin:8px 0 2px;font-size:30px;text-shadow:0 0 15px #FFD70077}p.sub{color:#8a7a40;margin:0 0 12px}.card{background:#151300;border:1px solid #3a3300;border-radius:20px;padding:16px;max-width:440px;margin:0 auto}.knob{width:160px;height:160px;border-radius:50%;margin:14px auto;background:#111;border:4px solid #FFD700;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFD700;font-size:42px;font-weight:900;box-shadow:0 0 40px #FFD70088}audio{width:100%;margin:12px 0}.now{color:#FFD700;font-weight:800;margin:8px}.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:16px;margin:6px 0}.btn-add{background:linear-gradient(180deg,#FFD700,#D4AF37);color:#000}.btn-live{background:#111;color:#FFD700;border:2px solid #FFD700}.song{background:#1e1a00;padding:12px;border-radius:10px;margin:6px 0;text-align:left;border-left:4px solid #FFD700;display:flex;justify-content:space-between}.del{color:#f55;font-size:20px}</style></head><body><h1>👑 PLAY DAT GOLD5</h1><p class="sub">GOLD5 EDITION - INSTANT PLAY - NO UPLOADING STUCK</p><div class="card"><div class="knob">75%<small style="font-size:12px;color:#8a7a40">GOLD</small></div><div class="now" id="now">Add MP3!</div><audio id="player" controls autoplay></audio><input id="fileInput" type="file" accept="audio/*,.mp3" multiple style="display:none"><button class="btn btn-add" onclick="document.getElementById('fileInput').click()">+ ADD MP3 - GOLD5 INSTANT PLAY</button><div id="list"></div><button class="btn btn-live" onclick="location.href='studio7.html'">● STUDIO 7 GOLD - GO LIVE</button></div><script>let songs=JSON.parse(localStorage.getItem('playdat_gold5')||'[]');let names=JSON.parse(localStorage.getItem('playdat_gold_names')||'{}');let cur=0;const p=document.getElementById('player');function save(){localStorage.setItem('playdat_gold5',JSON.stringify(songs));localStorage.setItem('playdat_gold_names',JSON.stringify(names));render();}function render(){document.getElementById('list').innerHTML=songs.map((u,i)=>{let n=names[u]||u.split('/').pop();return `<div class=song><b>${i===cur?'▶️ ':''}${n}</b><span class=del onclick="removeSong(${i})">✕</span></div>`}).join('')||'<p style=color:#444>No songs</p>';if(songs.length)document.getElementById('now').innerText='Now: '+(names[songs[cur]]||'Gold Song');}function removeSong(i){songs.splice(i,1);save();}function play(){if(!songs.length)return;p.src=songs[cur];p.play();render();}p.onended=()=>{cur=(cur+1)%songs.length;play();};document.getElementById('fileInput').addEventListener('change',e=>{for(let f of e.target.files){let u=URL.createObjectURL(f);songs.push(u);names[u]=f.name;}save();cur=songs.length-e.target.files.length;play();});render();if(songs.length)play();</script></body></html>
