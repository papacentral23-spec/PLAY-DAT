<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT - GUEST JOIN</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;text-align:center}
.top{background:#111;padding:12px;border-bottom:2px solid gold;color:gold;font-weight:bold}
.box{background:#111;margin:12px;padding:14px;border-radius:12px;border:1px solid #333}
.btn{padding:12px 18px;border:none;border-radius:10px;margin:6px;font-weight:bold;font-size:15px}
.gold{background:gold;color:#000}.red{background:red;color:#fff}.grey{background:#222;color:#fff;border:1px solid #444}
video{width:100%;max-height:240px;background:#000;border-radius:12px;border:1px solid #333}
</style></head><body>

<div class="top">👑 PLAY DAT - GUEST JOIN</div>

<div class="box">
Host ID: <input id="hid" value="PLAYDAT-KUMASI" style="background:#000;color:gold;border:1px solid gold;padding:8px;border-radius:8px;width:150px"><br><br>
Your Name: <input id="gname" placeholder="Your Name" style="background:#000;color:#fff;border:1px solid #555;padding:8px;border-radius:8px;width:130px"><br><br>

<div style="display:flex;gap:8px;justify-content:center">
<button class="btn grey" onclick="preview('voice')">🎙️ Voice Only</button>
<button class="btn gold" onclick="preview('video')">📹 Voice+Video</button>
</div>

<video id="pv" autoplay muted playsinline style="display:none;margin-top:10px"></video>
<div id="status" style="margin-top:10px;color:orange;font-size:13px">Choose Voice or Video</div>

<button id="joinBtn" class="btn red" style="width:90%;margin-top:14px;display:none" onclick="join()">🔴 JOIN LIVE STUDIO</button>
<button id="leaveBtn" class="btn grey" style="width:90%;margin-top:8px;display:none" onclick="location.reload()">Leave</button>
</div>

<div class="box">
<div style="font-size:12px;color:#aaa">Studio will see you in his Guest Grid - He can put you LIVE!</div>
<div id="studioVideo" style="margin-top:10px"></div>
</div>

<script>
let myStream, peer, call, hostId;
function preview(type){
 navigator.mediaDevices.getUserMedia({video:type=='video',audio:true}).then(s=>{
  myStream=s;
  let v=document.getElementById('pv'); v.style.display='block'; v.srcObject=s;
  document.getElementById('status').innerText='✅ Ready - Mic '+(type=='video'?'+ Camera ON':'ON');
  document.getElementById('joinBtn').style.display='block';
 }).catch(e=>alert('Allow mic/camera!'));
}
function join(){
 hostId=document.getElementById('hid').value.trim();
 let name=document.getElementById('gname').value||'Guest';
 peer=new Peer();
 peer.on('open',id=>{
  document.getElementById('status').innerText='🔗 Connecting to '+hostId+'...';
  call=peer.call(hostId, myStream, {metadata:{name:name}});
  call.on('stream', remote=>{
   document.getElementById('status').innerText='🔴 LIVE ON AIR with Studio!';
   document.getElementById('joinBtn').style.display='none';
   document.getElementById('leaveBtn').style.display='block';
   let v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.srcObject=remote;
   v.style.width='100%'; v.style.maxHeight='200px'; v.style.border='2px solid gold'; v.style.borderRadius='12px';
   document.getElementById('studioVideo').innerHTML=''; document.getElementById('studioVideo').appendChild(v);
  });
 });
}
</script></body></html>
