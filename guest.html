<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT - GUEST</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;text-align:center}
.top{background:#111;padding:12px;border-bottom:2px solid gold;color:gold;font-weight:bold;font-size:18px}
.box{background:#111;margin:12px;padding:14px;border-radius:14px;border:1px solid #333}
.btn{padding:12px 20px;border:none;border-radius:30px;margin:6px;font-weight:bold;font-size:16px;width:90%}
.gold{background:gold;color:#000}.red{background:red;color:#fff}.grey{background:#222;color:#fff;border:1px solid #555}
video{width:100%;max-height:240px;background:#000;border-radius:12px;border:1px solid #333}
input{background:#000;color:gold;border:1px solid gold;padding:10px;border-radius:8px;width:140px;text-align:center;font-weight:bold}
</style></head><body>
<div class="top">👥 PLAY DAT - GUEST JOIN LIVE</div>
<div class="box">
Host ID: <input id="hid" value="PLAYDAT999"><br>
<span style="font-size:12px;color:#aaa">Use same ID as Studio</span><br><br>
Name: <input id="gname" placeholder="Your Name" style="border-color:#555;color:#fff"><br><br>
<div style="display:flex;gap:8px;justify-content:center">
<button class="btn grey" onclick="preview('voice')">🎙️ Voice Only</button>
<button class="btn gold" onclick="preview('video')">📹 Video+Voice</button>
</div>
<video id="pv" autoplay muted playsinline style="display:none;margin-top:12px"></video>
<div id="status" style="margin-top:12px;color:orange">1. Choose Voice or Video</div>
<button id="joinBtn" class="btn red" style="display:none;margin-top:14px" onclick="join()">🔴 JOIN STUDIO LIVE</button>
<button id="leaveBtn" class="btn grey" style="display:none" onclick="location.reload()">❌ Leave</button>
</div>
<div class="box">
<div id="liveInfo" style="color:#aaa;font-size:12px">Studio preview will appear after JOIN</div>
<div id="studioBox" style="margin-top:10px"></div>
</div>
<script>
let myStream, peer, call;
function getHost(){let u=new URLSearchParams(location.search);return u.get('host')||document.getElementById('hid').value||'PLAYDAT999'}
function preview(type){
 navigator.mediaDevices.getUserMedia({video:type=='video',audio:true}).then(s=>{
  myStream=s; let v=document.getElementById('pv'); v.style.display='block'; v.srcObject=s;
  document.getElementById('status').innerText='✅ Mic '+(type=='video'?'+ Camera READY - Now JOIN':'READY - Now JOIN');
  document.getElementById('joinBtn').style.display='block';
 }).catch(e=>alert('Allow mic/camera in browser!'));
}
function join(){
 let host=getHost(); document.getElementById('hid').value=host;
 let name=document.getElementById('gname').value||'Guest';
 document.getElementById('status').innerText='🔗 Connecting to '+host+'...';
 peer=new Peer();
 peer.on('open',()=>{
  call=peer.call(host, myStream, {metadata:{name:name}});
  call.on('stream', remote=>{
   document.getElementById('status').innerText='🔴 YOU ARE LIVE WITH STUDIO!';
   document.getElementById('joinBtn').style.display='none';
   document.getElementById('leaveBtn').style.display='block';
   document.getElementById('liveInfo').innerText='🔴 LIVE - Studio audio:';
   let v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.srcObject=remote; v.style.width='100%'; v.style.maxHeight='200px'; v.style.border='2px solid gold'; v.style.borderRadius='12px';
   document.getElementById('studioBox').innerHTML=''; document.getElementById('studioBox').appendChild(v);
  });
  call.on('close',()=>document.getElementById('status').innerText='Studio ended');
 });
 peer.on('error',e=>document.getElementById('status').innerText='❌ Studio offline - Start studio first!');
}
let urlHost=new URLSearchParams(location.search).get('host'); if(urlHost) document.getElementById('hid').value=urlHost;
</script></body></html>
