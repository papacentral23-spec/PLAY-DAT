<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUEST MIC PRO - PLAY DAT</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:system-ui}.top{padding:12px;background:#0a0a0a;border-bottom:1px solid #D4AF3722;display:flex;justify-content:space-between;position:sticky;top:0;z-index:9}.nav{display:flex;gap:6px;font-size:11px;font-weight:800}.nav a{padding:6px 8px;border-radius:20px;color:#D4AF37;text-decoration:none;border:1px solid #D4AF3722}.nav a.active{background:#D4AF37;color:#000}.wrap{padding:14px}.card{background:#0e0e0e;border:2px solid #D4AF37AA;border-radius:18px;padding:16px;margin-bottom:14px}.btn{width:100%;padding:14px;border-radius:12px;font-weight:900;margin:6px 0;border:none;cursor:pointer}.gold{background:linear-gradient(#FFD700,#D4AF37);color:#000}.dark{background:#111;color:#D4AF37;border:2px solid #D4AF37}.red{background:#FF0000;color:#fff;animation:blink 1s infinite}.green{background:#00FF88;color:#000}.input,select{width:100%;padding:12px;border-radius:10px;background:#111;border:1px solid #D4AF37;color:#fff;margin:6px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch{width:60px;height:32px;background:#333;border-radius:20px;position:relative;cursor:pointer;transition:.3s}.switch.on{background:#00FF88}.knob{width:28px;height:28px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.3s}.switch.on .knob{left:30px}.livebox{padding:20px;border-radius:15px;text-align:center;border:3px dashed #333}.livebox.live{border-color:#FF0000;background:#300;animation:pulse 1s infinite}.vu{display:flex;gap:3px;justify-content:center;height:30px;align-items:end;margin:10px 0}.bar{width:6px;background:#D4AF37;border-radius:3px;height:5px}@keyframes blink{50%{opacity:.5}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}</style></head><body>
<div class="top"><b style="color:#D4AF37">👑 PLAY DAT</b><div class="nav"><a href="index.html">LISTEN</a><a href="studio7.html">STUDIO</a><a class="active" href="guest.html">GUEST MIC</a><a href="about.html">ABOUT</a></div></div>
<div class="wrap">

<div class="card"><p style="color:#888;font-size:10px;letter-spacing:3px">OPTION 1 - YOUR MIC</p><h3 style="color:#FFD700">🎙️ RODE EXPENSIVE MIC</h3><label style="font-size:12px;color:#aaa">Select Your Mic:</label><select id="micList"><option>Loading mics...</option></select><div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0"><div><b id="micStatus" style="color:#FF6B6B">● RODE OFF</b><br><small style="color:#666">Tap to turn ON/OFF</small></div><div class="switch" id="rodeSwitch"><div class="knob"></div></div></div><div class="vu" id="vu"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><p id="micInfo" style="font-size:11px;color:#666;text-align:center">Rode mic OFF - Turn ON to test</p></div>

<div class="card"><p style="color:#888;font-size:10px;letter-spacing:3px">OPTION 2 - GO LIVE</p><h3 style="color:#FFD700">🔴 REQUEST TO GO LIVE</h3><p style="color:#aaa;font-size:12px;margin:6px 0">Main Studio must APPROVE you</p><input class="input" id="gname" placeholder="Your Name"><input class="input" id="gshow" placeholder="Topic / Show name"><div class="livebox" id="liveBox"><h2 id="liveText" style="color:#666">⚫ WAITING</h2><p id="liveSub" style="color:#666;font-size:12px">Press REQUEST LIVE below</p></div><button class="btn gold" id="reqBtn">📡 REQUEST LIVE - ASK STUDIO</button><button class="btn red" id="goLiveBtn" style="display:none">🔴 YOU ARE LIVE! TAP TO END</button><button class="btn dark" id="cancelBtn" style="display:none">Cancel Request</button><p id="status" style="text-align:center;color:#D4AF37;font-weight:800;margin-top:8px"></p></div>

</div>
<script>
let stream=null,rodeOn=false,reqId=null;
let sel=document.getElementById('micList');
async function loadMics(){try{await navigator.mediaDevices.getUserMedia({audio:true});let devs=await navigator.mediaDevices.enumerateDevices();let mics=devs.filter(d=>d.kind=='audioinput');sel.innerHTML='';mics.forEach(m=>{let o=document.createElement('option');o.value=m.deviceId;o.text=m.label.includes('RODE')||m.label.includes('Rode')?'👑 '+m.label+' [RODE DETECTED]':m.label||'Mic '+(sel.length+1);if(m.label.toLowerCase().includes('rode')) o.selected=true;sel.appendChild(o);});}catch(e){sel.innerHTML='<option>Allow mic permission first</option>'}}
loadMics();

document.getElementById('rodeSwitch').onclick=async()=>{
 rodeOn=!rodeOn;
 let sw=document.getElementById('rodeSwitch'),st=document.getElementById('micStatus'),info=document.getElementById('micInfo');
 if(rodeOn){
  sw.classList.add('on');st.innerText='● RODE ON - LIVE MIC';st.style.color='#00FF88';
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:sel.value?{exact:sel.value}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});info.innerText='✅ Rode Expensive Mic ON - Studio quality!';info.style.color='#00FF88';vuMeter(stream);
  }catch(e){info.innerText='❌ Mic error: '+e.message}
 }else{
  sw.classList.remove('on');st.innerText='● RODE OFF';st.style.color='#FF6B6B';info.innerText='Rode mic OFF';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 }
};

function vuMeter(s){let ctx=new AudioContext(),src=ctx.createMediaStreamSource(s),an=ctx.createAnalyser();an.fftSize=256;src.connect(an);let data=new Uint8Array(an.frequencyBinCount);let bars=document.querySelectorAll('.bar');function loop(){if(!rodeOn) return;an.getByteFrequencyData(data);let avg=data.reduce((a,b)=>a+b)/data.length;bars.forEach((b,i)=>{b.style.height=(5+Math.random()*avg/4)+'px';b.style.background=avg>100?'#FF0000':'#D4AF37'});requestAnimationFrame(loop)}loop()}

document.getElementById('reqBtn').onclick=()=>{
 if(!rodeOn){alert('Turn ON your Rode mic first! Option 1');return}
 let name=document.getElementById('gname').value||'Guest';let topic=document.getElementById('gshow').value||'Live Talk';
 reqId=Date.now();let reqs=JSON.parse(localStorage.getItem('g5liveRequests')||'[]');
 reqs.push({id:reqId,name,topic,mic:'RODE ON',status:'PENDING',time:new Date().toLocaleTimeString()});localStorage.setItem('g5liveRequests',JSON.stringify(reqs));
 document.getElementById('reqBtn').style.display='none';document.getElementById('cancelBtn').style.display='block';
 document.getElementById('liveText').innerText='🟡 REQUEST SENT';document.getElementById('liveText').style.color='#FFD700';document.getElementById('liveSub').innerText='Waiting for Studio 7 to allow you...';document.getElementById('status').innerText='Request sent to Main Studio!';
 checkApproval();
};

function checkApproval(){let int=setInterval(()=>{let reqs=JSON.parse(localStorage.getItem('g5liveRequests')||'[]');let mine=reqs.find(r=>r.id==reqId);if(!mine) return;if(mine.status=='APPROVED'){clearInterval(int);document.getElementById('liveBox').classList.add('live');document.getElementById('liveText').innerText='🔴 YOU ARE LIVE!';document.getElementById('liveText').style.color='#FF0000';document.getElementById('liveSub').innerText='Your Rode mic is LIVE on air!';document.getElementById('cancelBtn').style.display='none';document.getElementById('goLiveBtn').style.display='block';document.getElementById('status').innerText='🎙️ STUDIO APPROVED YOU - YOU ARE LIVE!';}else if(mine.status=='DENIED'){clearInterval(int);document.getElementById('liveText').innerText='❌ DENIED';document.getElementById('status').innerText='Studio denied - Try again later';document.getElementById('reqBtn').style.display='block';document.getElementById('cancelBtn').style.display='none';}},1000)}

document.getElementById('cancelBtn').onclick=()=>{let reqs=JSON.parse(localStorage.getItem('g5liveRequests')||'[]').filter(r=>r.id!=reqId);localStorage.setItem('g5liveRequests',JSON.stringify(reqs));location.reload()};
document.getElementById('goLiveBtn').onclick=()=>{if(confirm('End live?')) location.reload()};
</script></body></html>
