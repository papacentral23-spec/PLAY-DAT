<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PLAY-DAT GUEST - PRIVATE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center;padding:3vw}
.top{background:#e0c36a;color:#000;padding:12px;font-weight:900;font-size:clamp(14px,4vw,18px)}
h1{font-size:clamp(32px,10vw,55px);color:#e0c36a;margin:8px}
.box{max-width:600px;margin:10px auto;background:#151515;border:2px solid #e0c36a;border-radius:14px;padding:14px}
input{width:90%;padding:13px;border-radius:10px;border:0;font-size:16px;text-align:center;font-weight:900}
.btn{width:90%;max-width:350px;padding:18px;margin:8px;border-radius:30px;border:0;font-weight:900;font-size:16px;cursor:pointer}
.btn.red{background:#ff2222;color:#fff;font-size:18px}
.btn.gold{background:#e0c36a;color:#000}
.btn.white{background:#fff;color:#000}
.live{color:#0f0;font-weight:900}
.micStatus{font-size:14px;color:#aaa}
</style>
</head>
<body>
<div class="top">PLAY-DAT WORLD - GUEST LINK -      🔒</div>
<h1>GUEST MIC</h1>
<div>Talk to Studio -      (     )</div>
<div class="live">●</div>

<div class="box">
<b>YOUR NAME</b><br><br>
<input id="guestName" placeholder="Type Your Name - e.g. Kwame">
<button class="btn gold" onclick="saveName()">SAVE MY NAME</button>
<div id="nameShow" style="color:#e0c36a;font-weight:900"></div>
</div>

<div class="box">
<b>1. HEAR STUDIO FIRST 🔊</b><br>
<audio id="studioHear" controls style="width:100%"><source src="ALHA-01.mp3"></audio>
<div style="font-size:12px;color:#aaa">Play this - You hear DJ before you talk</div>
</div>

<div class="box">
<b>2. YOUR MIC - MIC TEST</b><br>
<button class="btn gold" onclick="testMic()">🎤 TEST MY MIC</button>
<div id="micStatus" class="micStatus">Mic not tested yet</div><br>
<button class="btn red" id="talkBtn" onmousedown="startTalk()" onmouseup="stopTalk()" ontouchstart="startTalk()" ontouchend="stopTalk()">● HOLD TO TALK TO STUDIO</button>
<div id="talkStatus" style="color:#ff2222;font-weight:900">RELEASE TO STOP - HOLD = TALKING</div>
</div>

<div class="box">
<b>VOLUME FOR GUEST</b><br>
<input type="range" min="0" max="200" value="120" style="width:100%;accent-color:#e0c36a;height:30px" oninput="document.getElementById('vTxt').textContent='Vol: '+this.value+'%'">
<div id="vTxt">Vol: 120% - LOUD</div>
<button class="btn gold" onclick="alert('Analog Warmth ON - Rode Warm')">ANALOG WARMTH: ON</button>
<button class="btn white" onclick="alert('Leaving Guest - Thank you!')">LEAVE STUDIO</button>
</div>

<script>
let talking=false;
function saveName(){let n=document.getElementById('guestName').value; if(!n) return alert('Type your name first'); document.getElementById('nameShow').textContent='Hello '+n+' - Studio sees you as: '+n; alert('Saved '+n)}
function testMic(){navigator.mediaDevices.getUserMedia({audio:true}).then(()=>{document.getElementById('micStatus').textContent='✅ MIC OK -  Ready - You can talk now'; document.getElementById('micStatus').style.color='#0f0'}).catch(()=>{document.getElementById('micStatus').textContent='❌ MIC BLOCKED - Allow mic in browser'; document.getElementById('micStatus').style.color='red'})}
function startTalk(){talking=true; document.getElementById('talkStatus').textContent='🔴 YOU ARE TALKING LIVE TO STUDIO!'; document.getElementById('talkBtn').style.background='#00ff00'; document.getElementById('talkBtn').style.color='#000'; navigator.mediaDevices.getUserMedia({audio:true}).then(()=>{})}
function stopTalk(){talking=false; document.getElementById('talkStatus').textContent='RELEASE TO STOP - HOLD = TALKING'; document.getElementById('talkBtn').style.background='#ff2222'; document.getElementById('talkBtn').style.color='#fff'}
</script>
</body>
</html>
