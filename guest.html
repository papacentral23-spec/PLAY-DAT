<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT GUEST - KUMASI</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;text-align:center}
.top{background:linear-gradient(90deg,#0af,cyan);color:#000;padding:12px;font-weight:bold;display:flex;justify-content:space-between}
.box{background:#151515;margin:10px;padding:14px;border-radius:14px;border:1px solid #333}
input{padding:12px;border-radius:8px;border:1px solid #0af;background:#000;color:#fff;width:60%;font-size:16px}
.btn{padding:12px 22px;border:none;border-radius:25px;font-weight:bold;margin:5px;font-size:14px}
.blue{background:#0af;color:#fff}.green{background:#0f0;color:#000}.red{background:red;color:#fff}.gold{background:gold;color:#000}.gray{background:#555;color:#fff}
video{width:100%;height:220px;background:#000;border-radius:12px}
.row{display:flex;justify-content:space-around;margin:10px 0}
</style></head><body>
<div class="top"><span>🎙️ PLAY DAT GUEST</span><span id="dot">⚫ OFFLINE</span></div>

<div class="box">
<input id="hostId" value="PLAYDAT999" placeholder="Host ID">
<button class="btn blue" onclick="joinStudio()">JOIN STUDIO</button><br>
<span id="stat" style="color:#aaa;font-size:12px">Enter Host ID → JOIN</span>
</div>

<div class="box">
<video id="hostVid" autoplay playsinline controls style="background:#000"></video><br><br>
<audio id="hostAud" autoplay playsinline controls style="width:100%"></audio>
<div style="margin:8px 0;font-weight:bold" id="liveTxt">Not Connected</div>

<div class="row">
<button class="btn gray" id="micBtn" onclick="toggleMic()">🎤 MIC: OFF</button>
<button class="btn gray" id="camBtn" onclick="toggleCam()">📷 CAM: OFF</button>
<button class="btn red" id="leaveBtn" onclick="leave()" style="display:none">⏹️ LEAVE</button>
</div>

<video id="myVid" autoplay muted playsinline style="height:120px;margin-top:8px"></video>
<div style="font-size:12px;color:#aaa">You: <span id="myMode">MIC OFF, CAM OFF</span></div>
</div>

<script>
let peer, hostCall, myStream, micOn=false, camOn=false;

async function getMyMedia(){
 if(!myStream){
   myStream=await navigator.mediaDevices.getUserMedia({
     video:{width:320,height:240},
     audio:{channelCount:2,echoCancellation:false,autoGainControl:false,noiseSuppression:false}
   });
   document.getElementById('myVid').srcObject=myStream;
   // start with both off
   myStream.getAudioTracks().forEach(t=>t.enabled=false);
   myStream.getVideoTracks().forEach(t=>t.enabled=false);
 }
 return myStream;
}

async function joinStudio(){
 let host=(document.getElementById('hostId').value.trim()||'PLAYDAT999');
 document.getElementById('stat').innerText='🔗 Connecting to '+host+'...';
 document.getElementById('dot').innerText='🟡 JOINING';
 await getMyMedia();
 peer=new Peer();
 peer.on('open',()=>{
   hostCall=peer.call(host, myStream);
   hostCall.on('stream', s=>{
     document.getElementById('hostVid').srcObject=s;
     document.getElementById('hostAud').srcObject=s;
     document.getElementById('hostVid').play().catch(()=>{});
     document.getElementById('hostAud').play().catch(()=>{});
     document.getElementById('liveTxt').innerText='🔴 LIVE - Connected to '+host+' - VIDEO STEREO';
     document.getElementById('dot').innerText='🔴 LIVE';
     document.getElementById('stat').innerText='✅ Connected! You can turn MIC ON to talk';
     document.getElementById('leaveBtn').style.display='inline-block';
   });
   hostCall.on('close',()=>{document.getElementById('liveTxt').innerText='❌ Disconnected'; document.getElementById('dot').innerText='⚫ OFFLINE';});
   setTimeout(()=>{if(!document.getElementById('hostVid').srcObject){document.getElementById('stat').innerText='❌ Host OFFLINE - Tell studio to GO LIVE first!'; document.getElementById('dot').innerText='⚫ OFFLINE';}},6000);
 });
}

function toggleMic(){
 micOn=!micOn;
 myStream.getAudioTracks().forEach(t=>t.enabled=micOn);
 document.getElementById('micBtn').innerText=micOn?'🎤 MIC: ON':'🎤 MIC: OFF';
 document.getElementById('micBtn').className=micOn?'btn green':'btn gray';
 updateMyMode();
}

function toggleCam(){
 camOn=!camOn;
 myStream.getVideoTracks().forEach(t=>t.enabled=camOn);
 document.getElementById('camBtn').innerText=camOn?'📷 CAM: ON':'📷 CAM: OFF';
 document.getElementById('camBtn').className=camOn?'btn blue':'btn gray';
 updateMyMode();
}

function updateMyMode(){
 document.getElementById('myMode').innerText=(micOn?'MIC ON':'MIC OFF')+', '+(camOn?'CAM ON':'CAM OFF');
}

function leave(){location.reload();}
</script></body></html>
