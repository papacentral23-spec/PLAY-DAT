<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUEST MIC - PLAY DAT</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial;margin:0}
.top{background:#D4AF37;color:#000;padding:12px;font-weight:900}
.card{background:#111;border:2px solid #D4AF37;border-radius:15px;margin:15px;padding:15px}
button{padding:14px 30px;border-radius:30px;border:none;font-weight:900;font-size:16px;margin:10px}
.on{background:#0f0;color:#000}.off{background:#333;color:#fff}
input{padding:10px;width:80%;border-radius:20px;border:1px solid #D4AF37;background:#222;color:#fff;text-align:center}
</style>
</head>
<body>
<div class="top">👥 GUEST MIC - PLAY DAT</div>
<div class="card">
<h3 style="color:#FFD700">🎙️ JOIN AS GUEST</h3>
<input id="studioId" placeholder="Enter STUDIO ID from boss">
<br>
<button id="callBtn" class="off" onclick="callStudio()">📞 CALL STUDIO</button>
<p id="status" style="font-size:12px;color:#888">Enter ID and call</p>
<audio id="remote" controls autoplay style="width:100%;display:none"></audio>
</div>
<script>
let peer, localStream;
peer=new Peer({config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});

async function callStudio(){
 let id=document.getElementById('studioId').value.trim();
 if(!id){alert('Enter Studio ID');return}
 localStream=await navigator.mediaDevices.getUserMedia({audio:true});
 let call=peer.call(id, localStream, {metadata:{type:'guest'}});
 document.getElementById('status').innerText='📞 Calling studio...';
 call.on('stream', s=>{
  document.getElementById('remote').style.display='block';
  document.getElementById('remote').srcObject=s;
  document.getElementById('status').innerText='✅ LIVE ON AIR with Studio!';
  document.getElementById('callBtn').innerText='🔴 LIVE ON AIR';
  document.getElementById('callBtn').className='on';
 });
 call.on('close', ()=>{document.getElementById('status').innerText='Call ended';});
}
</script>
</body>
</html>
