<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PLAY-DAT  -  Live</title>
<style>
*{box-sizing:border-box}body{background:#0a0a0a;color:#D4AF37;font-family:monospace;margin:0;padding:8px;text-align:center}
.box{max-width:600px;margin:0 auto;background:#1e1e1e;border:3px solid #D4AF37;border-radius:20px;padding:14px}
h2{letter-spacing:3px;margin:6px 0;font-size:18px}
p{color:#888;font-size:10px;letter-spacing:2px;margin:4px}
.wrap{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden;border:2px solid #D4AF37;margin:10px 0}
@media (orientation: portrait){ .wrap{height:48vh} }
@media (orientation: landscape){ .wrap{height:52vh} }
.wrap video{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.9);border:1.5px solid #D4AF37;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:900;z-index:10}
input{width:100%;padding:14px;border-radius:12px;border:1.5px solid #D4AF37;background:#000;color:#D4AF37;font-weight:900;text-align:center;font-size:14px;margin:8px 0;letter-spacing:1px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:900;font-size:14px;letter-spacing:2px;cursor:pointer;margin:6px 0}
.join{background:linear-gradient(90deg,#D4AF37,#FFD700);color:#000}
.wait{background:#2a2a2a;color:#888;border:1px solid #444}
.status{display:flex;justify-content:space-between;background:#000;border:1px solid #333;border-radius:8px;padding:8px;font-size:10px;margin:6px 0}
.dot{width:10px;height:10px;border-radius:50%;background:#ff0000;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style></head><body>
<h2>🎤 PLAY-DAT </h2>
<p> •  LIVE • </p>

<div class="box">
<div class="status"><span><span class="dot"></span> LIVE STUDIO</span><span>🔴 ON AIR</span></div>

<div class="wrap">
<div class="badge">🟡 PLAY-DAT WORLD • </div>
<video id="preview" autoplay muted playsinline poster=""></video>
</div>

<input id="guestName" placeholder="YOUR NAME e.g. COACH KOFI" maxlength="20">
<div class="btn join" onclick="joinLive()">🎙️ JOIN LIVE NOW</div>
<div class="btn wait" onclick="document.getElementById('preview').srcObject=null">🔇 TEST MIC / CAM</div>

<div class="status"><span>📹 Camera: <b style="color:#0f0">OK</b></span><span>🎧 Mic: <b style="color:#0f0">OK</b></span></div>
<div class="status"><span>🔗 Studio: Connected</span><span>🟡 Waiting Host</span></div>

<p style="margin-top:10px;color:#D4AF37;font-size:9px">Rotate phone - Portrait/Landscape auto-fill • Your video goes to Studio 16CH<br>∞ Unlimited Listeners will hear you</p>
</div>

<script>
async function joinLive(){
const name=document.getElementById('guestName').value||'GUEST';
try{
const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
document.getElementById('preview').srcObject=stream;
alert('✅ '+name+' JOINED! Host sees you in Studio!');
}catch(e){alert('⚠️ Allow Camera/Mic to join!');}
}
(async()=>{
try{
const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
document.getElementById('preview').srcObject=s;
}catch{}
})();
</script>
</body></html>
