<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PLAY-DAT STUDIO -  Console</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#D4AF37;font-family:monospace;padding:6px}
.header{background:#1a1a1a;border:2px solid #D4AF37;border-radius:14px;padding:10px;text-align:center;margin-bottom:8px}
.header h1{letter-spacing:3px;font-size:16px}.header p{color:#888;font-size:8px;letter-spacing:2px;margin:2px}
.console{max-width:1100px;margin:0 auto;display:grid;gap:8px}
@media (orientation: landscape){ .console{grid-template-columns:1.5fr 1fr} }
.card{background:#1e1e1e;border:2px solid #D4AF37;border-radius:14px;padding:10px;overflow:hidden}
.card-title{font-size:10px;font-weight:900;letter-spacing:2px;margin-bottom:8px;color:#D4AF37;border-bottom:1px solid #333;padding-bottom:6px}
.wrap{position:relative;width:100%;background:#000;border-radius:10px;overflow:hidden;border:1.5px solid #D4AF37}
@media (orientation: portrait){
.wrap{height:42vh}
.wrap iframe{position:absolute;top:50%;left:50%;width:185%;height:105%;transform:translate(-50%,-50%);border:0}
}
@media (orientation: landscape){
.wrap{height:50vh}
.wrap iframe{position:absolute;top:50%;left:50%;width:100%;height:155%;transform:translate(-50%,-50%);border:0}
}
.watermark{position:absolute;top:8px;left:8px;z-index:10;background:rgba(0,0,0,0.9);border:1.5px solid #D4AF37;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:900}
.btn{display:flex;gap:6px;margin:8px 0}
.btn button{flex:1;padding:12px;border-radius:10px;border:0;font-weight:900;font-size:11px;cursor:pointer}
.live{background:#ff0000;color:#fff}.gold{background:#D4AF37;color:#000}.dark{background:#2a2a2a;color:#D4AF37;border:1px solid #D4AF37}
.status{font-size:10px;padding:6px;background:#000;border-radius:6px;border:1px solid #333;display:flex;justify-content:space-between;margin:4px 0}
.mixer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.ch{background:#111;border:1px solid #333;border-radius:8px;padding:6px;text-align:center}
.ch .label{font-size:8px;color:#888}.ch .fader{width:100%;height:50px;background:linear-gradient(0deg,#D4AF37,#333);border-radius:4px;margin:4px 0}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;height:28px;background:#000;z-index:10;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#D4AF37;border-top:1px solid #D4AF37}
.guest-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.guest{border:1px dashed #444;border-radius:8px;padding:8px;text-align:center;font-size:9px;color:#888}
.guest.active{border-color:#D4AF37;color:#D4AF37;background:rgba(212,175,55,0.1)}
input{background:#000;border:1px solid #D4AF37;color:#D4AF37;padding:8px;border-radius:8px;width:100%;font-size:11px;margin:4px 0}
</style></head><body>
<div class="header"><h1>PLAY-DAT STUDIO • </h1><p>
• • </p></div>
<div class="console">
<div>
<div class="card"><div class="card-title">📹 L</div>
<div class="wrap">
<div class="watermark">🟡 LIVE • PLAY-DAT WORLD</div>
<iframe src="https://www.youtube-nocookie.com/embed/id7JOjDMmEI?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&playsinline=1" allow="autoplay;encrypted-media"></iframe>
<div class="bottom-bar">PLAY-DAT STUDIO • • LIVE</div>
</div>
<div class="btn"><button class="live">🔴 GO LIVE</button><button class="gold" onclick="window.open('listener.html','_blank')">🌍 VIEW LISTENER</button></div>
<div class="btn"><button class="dark" style="width:100%" onclick="window.open('guest.html','_blank')">👥 GUEST LINK</button></div>
<div class="status"><span>🔊 ALHA-01.mp3</span><span>🟢 ON AIR</span></div>
<div class="status"><span>👁️ ∞ UNLIMITED</span><span>📱 FULL</span></div>
</div>
<div class="card"><div class="card-title">🎚️ 16CH MIXER</div><div class="mixer"><script>for(let i=1;i<=16;i++){document.write(`<div class="ch"><div class="label">CH ${i}</div><div class="fader"></div><b style="font-size:8px;color:#D4AF37">${i<=2?'MIC':i<=4?'GST':i<=8?'MUS':'FX'}</b></div>`)}</script></div></div>
</div>
<div>
<div class="card"><div class="card-title">👥 GUESTS</div><div class="guest-grid"><div class="guest active">G1<br>🟢 ON</div><div class="guest">G2<br>⚫ OFF</div><div class="guest">G3<br>⚫ OFF</div><div class="guest">G4<br>⚫ OFF</div></div><input value="https://papacentral23-spec.github.io/PLAY-DAT/guest.html" readonly><div class="btn"><button class="gold" onclick="navigator.clipboard.writeText(this.previousElementSibling.value)">📋 COPY LINK</button></div></div>
<div class="card"><div class="card-title">💬 CHAT</div><div style="background:#000;height:100px;border-radius:8px;padding:8px;font-size:9px;color:#888">DJ: Welcome!<br>Listener: Clear!</div><input placeholder="Message..."></div>
</div>
</div>
</body></html>
