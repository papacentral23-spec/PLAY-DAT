<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT WORLD - UNLIMITED VOICE V2</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0}
.top{background:#D4AF37;color:#000;padding:14px;font-weight:900}
.card{background:#111;border:2px solid #D4AF37;border-radius:20px;margin:15px;padding:18px}
.play{background:linear-gradient(90deg,#FFD700,#D4AF37);color:#000;border:none;padding:16px 45px;border-radius:50px;font-size:20px;font-weight:900}
.live{background:red;color:#fff;padding:4px 10px;border-radius:12px;font-size:11px}
#ytWrap{position:relative;width:100%;height:260px;background:#000;border-radius:14px;overflow:hidden;margin-top:12px}
#ytWrap iframe{width:100%;height:100%;border:none}
.switch{margin-top:12px;display:flex;gap:8px;justify-content:center}
.switch button{flex:1;padding:10px;border-radius:20px;border:1px solid #D4AF37;background:#222;color:#D4AF37;font-weight:bold}
.switch button.active{background:#D4AF37;color:#000}
.vol{width:90%;margin-top:10px}
</style>
</head>
<body>
<div class="top">👑 PLAY DAT WORLD - UNLIMITED VOICE <span class="live">● LIVE</span></div>

<div class="card">
<h2 style="color:#FFD700;margin:5px;font-size:20px">🔊 TAP TO PLAY - UNLIMITED</h2>
<p id="status" style="color:#888;font-size:12px">Tap PLAY then UNMUTE on video</p>

<button class="play" id="btn" onclick="playNow()">▶️ PLAY + UNMUTE</button>

<div id="ytWrap">
<iframe id="yt" src="https://www.youtube.com/embed/id7JOjDMmEI?autoplay=0&controls=1&modestbranding=1&rel=0&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<div class="switch">
<button id="bVoice" class="active" onclick="setMode('voice')">🎙️ VOICE</button>
<button id="bMusic" onclick="setMode('music')">🎵 MUSIC</button>
<button onclick="document.getElementById('yt').requestFullscreen()">⛶ FULL</button>
</div>

<input type="range" class="vol" min="0" max="100" value="100" oninput="setVol(this.value)">
<div style="font-size:11px;color:#555">Volume: <span id="v">100%</span> | Unlimited Zeno Style</div>

<p style="font-size:11px;color:#D4AF37;margin-top:10px">👑 PLAY DAT WORLD - Committed To Quality</p>
</div>

<script>
function playNow(){
 let f=document.getElementById('yt');
 f.src="https://www.youtube.com/embed/id7JOjDMmEI?autoplay=1&controls=1&modestbranding=1&rel=0&playsinline=1&mute=0";
 document.getElementById('status').innerText='✅ LIVE - If no voice, tap speaker icon inside video to unmute';
 document.getElementById('btn').innerText='🔊 PLAYING';
 document.getElementById('btn').style.background='#0f0';
}
function setMode(m){
 document.getElementById('bVoice').classList.toggle('active',m=='voice');
 document.getElementById('bMusic').classList.toggle('active',m=='music');
 document.getElementById('status').innerText=m=='voice'?'🎙️ VOICE MODE - DJ Live':'🎵 MUSIC MODE - Ignition Feeds';
}
function setVol(v){
 document.getElementById('v').innerText=v+'%';
 // Note: YouTube iframe volume can't be set by slider - use speaker inside video
}
</script>
</body>
</html>
