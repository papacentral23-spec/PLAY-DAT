<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT LISTENER</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>body{background:#000;color:#fff;text-align:center;font-family:Arial;margin:0}
.box{background:#111;margin:12px;padding:12px;border-radius:14px;border:1px solid #333}
.btn{background:gold;color:#000;padding:14px 30px;border:none;border-radius:25px;font-weight:bold;font-size:16px}
video{width:100%;height:220px;background:#000;border-radius:12px}</style>
</head><body>
<div style="background:gold;color:#000;padding:12px;font-weight:bold">PLAY DAT RADIO - KUMASI - VIDEO LIVE</div>
<div class="box">
<h3 id="st">Connecting...</h3>
<video id="vid" autoplay playsinline controls></video><br><br>
<audio id="aud" autoplay playsinline controls style="width:100%"></audio><br><br>
<button class="btn" onclick="join()">🔊 TAP TO PLAY - VIDEO + STEREO</button>
<div id="info" style="margin-top:10px;color:#aaa;font-size:12px"></div>
</div>
<script>
let peer;
function getHost(){let p=new URLSearchParams(location.search);return p.get('host')||'PLAYDAT999'}
function join(){
 let host=getHost();
 document.getElementById('st').innerText='🔗 Searching '+host+'...';
 document.getElementById('info').innerText='ID: '+host;
 peer=new Peer();
 peer.on('open',()=>{
   let call=peer.call(host, new MediaStream());
   call.on('stream', s=>{
     document.getElementById('vid').srcObject=s;
     document.getElementById('aud').srcObject=s;
     document.getElementById('vid').play().catch(()=>{});
     document.getElementById('aud').play().catch(()=>{});
     document.getElementById('st').innerText='🔴 LIVE - '+host+' - VIDEO STEREO';
   });
   call.on('error',()=>{document.getElementById('st').innerText='❌ Cannot find studio '+host;});
   setTimeout(()=>{if(!document.getElementById('vid').srcObject)document.getElementById('st').innerText='❌ Studio OFFLINE - Start studio first!';},5000);
 });
}
window.onload=()=>{document.getElementById('info').innerText='Host ID: '+getHost();};
</script></body></html>
