<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY-DAT LISTENER</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:10px}button{padding:18px 30px;font-size:20px;border-radius:12px;border:0;background:#0f0;font-weight:bold}iframe{width:100%;height:240px;border:0;border-radius:12px}audio{width:100%;margin-top:10px}</style></head><body>
<h1>📻 PLAY-DAT LIVE</h1>
<p id="s">⚪ OFFLINE - Press JOIN</p>
<div id="ytbox"><iframe id="ytf" src="https://www.youtube.com/embed/id7JOjDMmEI?autoplay=1&mute=0" allow="autoplay"></iframe></div>
<p>🎧 VIDEO + VOICE + MP3 - ALWAYS TOGETHER</p>
<audio id="aud" controls autoplay></audio>
<br><button onclick="join()">▶ JOIN LIVE NOW - ALWAYS</button>
<br><br><button onclick="retry()">🔁 RETRY JOIN</button>
<script>
let peer;
function join(){
document.getElementById('s').innerText='Trying 1 - Connecting to PLAY-DAT-LIVE-1...';
peer=new Peer();
peer.on('open',()=>{
let conn=peer.connect('PLAY-DAT-LIVE-1');
let call=peer.call('PLAY-DAT-LIVE-1',null);
if(call){ call.on('stream',s=>{ let a=document.getElementById('aud'); a.srcObject=s; a.play().catch(()=>{}); document.getElementById('s').innerText='🔴 LIVE - CONNECTED! You hear DJ NOW - VIDEO + MP3 + VOICE ALWAYS'; }); }
setTimeout(()=>{ if(document.getElementById('s').innerText.includes('Trying')) document.getElementById('s').innerText='❌ ERROR: Studio NOT LIVE - Ask DJ to GO LIVE first'; },8000);
});
}
function retry(){ join(); }
</script></body></html>
