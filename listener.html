<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT LISTENER</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>body{background:#000;color:#fff;text-align:center;font-family:Arial;margin:0}
.box{background:#111;margin:12px;padding:16px;border-radius:14px;border:1px solid #333}
.btn{background:gold;color:#000;padding:14px 30px;border:none;border-radius:25px;font-weight:bold;font-size:16px}</style>
</head><body>
<div style="background:gold;color:#000;padding:12px;font-weight:bold">PLAY DAT RADIO - KUMASI</div>
<div class="box">
<h3 id="st">Connecting...</h3>
<audio id="aud" autoplay playsinline controls style="width:100%"></audio><br><br>
<button class="btn" onclick="join()">🔊 TAP TO PLAY - STEREO</button>
<div id="info" style="margin-top:10px;color:#aaa;font-size:12px"></div>
</div>
<script>
let peer;
function getHost(){let p=new URLSearchParams(location.search);return p.get('host')||'PLAYDAT999'}
function join(){
 let host=getHost();
 document.getElementById('st').innerText='🔗 Searching '+host+'...';
 document.getElementById('info').innerText='ID: '+host;
 peer=new Peer();
 peer.on('open',()=>{
   let conn=peer.connect(host);
   let call=peer.call(host, new MediaStream());
   call.on('stream', s=>{
     let aud=document.getElementById('aud');
     aud.srcObject=s;
     aud.play().catch(()=>{});
     document.getElementById('st').innerText='🔴 LIVE - '+host+' - STEREO';
   });
   call.on('error',()=>{document.getElementById('st').innerText='❌ Cannot find studio ID '+host+' - Check ID'});
   call.on('close',()=>{document.getElementById('st').innerText='⚫ Studio Offline'});
   setTimeout(()=>{if(!document.getElementById('aud').srcObject)document.getElementById('st').innerText='❌ Cannot find studio ID '+host+' - Check ID - Is studio LIVE?';},5000);
 });
 peer.on('error', e=>{document.getElementById('st').innerText='❌ Error: '+e.type});
}
window.onload=()=>{let h=getHost();document.getElementById('info').innerText='Host ID: '+h;};
</script></body></html>
