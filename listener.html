<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PLAY-DAT WORLD</title>
<style>
*{box-sizing:border-box}
body{background:#0e0e0e;color:#D4AF37;font-family:monospace;text-align:center;margin:0;padding:8px}
.header{padding:8px}
.player{max-width:800px;margin:0 auto;background:#1e1e1e;border:3px solid #D4AF37;border-radius:20px;padding:10px}
.switch{display:flex;gap:8px;justify-content:center;margin:10px 0}
.switch button{padding:12px;border-radius:12px;border:0;font-weight:900;width:50%;font-size:14px;letter-spacing:0.5px}
.btnA{background:#fff;color:#000}.btnV{background:#ff4400;color:#fff}.btnIdle{background:#2c2c2c;color:#888;border:1px solid #444}
.wrap{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden;border:2px solid #D4AF37}
/* PORTRAIT - Phone vertical */
@media (orientation: portrait){
.wrap{height:78vh; aspect-ratio:auto}
.wrap iframe{position:absolute;top:50%;left:50%;width:320%;height:100%;transform:translate(-50%,-50%);border:0}
}
/* LANDSCAPE - Phone sideways */
@media (orientation: landscape){
.wrap{height:65vh; aspect-ratio:16/9}
.wrap iframe{position:absolute;top:50%;left:50%;width:100%;height:250%;transform:translate(-50%,-50%);border:0}
}
.watermark{position:absolute;top:12px;left:12px;z-index:10;background:rgba(0,0,0,0.85);border:1.5px solid #D4AF37;border-radius:30px;padding:6px 14px;font-size:12px;font-weight:900;letter-spacing:1px;color:#D4AF37;display:flex;align-items:center;gap:6px}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;height:44px;background:linear-gradient(0deg,#000 90%,transparent);z-index:10;display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:2px;font-size:12px;color:#D4AF37}
.mask-t{position:absolute;top:0;left:0;right:0;height:70px;background:#000;z-index:9}
.mask-b{position:absolute;bottom:44px;left:0;right:0;height:35px;background:#000;z-index:9}
</style></head><body>
<div class="header"><h2 style="margin:2px;color:#D4AF37;letter-spacing:3px">PLAY-DAT WORLD 🌍</h2><p style="color:#888;font-size:10px;margin:0;letter-spacing:4px">ABBEY ROAD GREY GOLD • LIVE</p></div>
<div class="player">
<div class="switch">
<button id="bA" class="btnA" onclick="go('a')">🎵 AUDIO MODE<br><small>Save Data</small></button>
<button id="bV" class="btnIdle" onclick="go('v')">📹 VIDEO MODE<br><small>See Studio</small></button>
</div>
<div id="aBox"><audio controls autoplay style="width:100%;height:54px;border-radius:10px" src="ALHA-01.mp3"></audio></div>
<div id="vBox" class="wrap" style="display:none">
<div class="mask-t"></div>
<div class="watermark">🟡 PLAY-DAT WORLD</div>
<iframe src="https://www.youtube-nocookie.com/embed/id7JOjDMmEI?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&fs=0&playsinline=1" allow="autoplay;encrypted-media" allowfullscreen></iframe>
<div class="mask-b"></div>
<div class="bottom-bar">PLAY-DAT LIVE • GREY GOLD CONSOLE</div>
</div>
<p style="color:#D4AF37;font-size:10px;margin:10px 0 2px">Listeners: ∞ UNLIMITED • Rotate phone, it auto-fills!</p>
</div>
<script>function go(m){const a=document.getElementById('aBox'),v=document.getElementById('vBox'),bA=document.getElementById('bA'),bV=document.getElementById('bV');if(m=='a'){a.style.display='block';v.style.display='none';bA.className='btnA';bV.className='btnIdle'}else{a.style.display='none';v.style.display='block';bA.className='btnIdle';bV.className='btnV'}} go('v');</script>
</body></html>
