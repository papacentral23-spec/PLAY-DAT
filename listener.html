<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT WORLD - LISTEN LIVE</title></head>
<body style="background:#000;color:white;text-align:center;font-family:Arial;margin:0">

<div style="background:linear-gradient(90deg,gold,#ff6600);color:black;padding:12px;font-weight:bold">
👑 PLAY DAT WORLD LIVE RADIO - KUMASI GHANA
<div id="liveDot" style="display:inline-block;width:12px;height:12px;background:red;border-radius:50%;animation:blink 1s infinite"></div> LIVE NOW
</div>

<div style="padding:20px">
<h2 style="color:gold">🔊 You Are Listening To Studio Live</h2>
<p id="nowPlaying" style="color:#ccc">🎵 Connecting to main studio music...</p>

<!-- REAL RADIO PLAYER - NO MP3 UPLOAD, NO MIC -->
<div style="background:#111;border:2px solid gold;border-radius:16px;padding:20px;margin:10px">
<button id="playBtn" onclick="playRadio()" style="background:gold;color:black;padding:18px 40px;border:none;border-radius:50px;font-size:20px;font-weight:bold">▶️ TAP TO PLAY RADIO</button>
<br><br>
<input type="range" id="vol" min="0" max="100" value="80" style="width:80%" oninput="setVol(this.value)">
<div>Volume: <span id="v">80%</span></div>
<br>
<button onclick="toggleVideo()" id="vidBtn" style="background:#222;color:white;padding:10px 20px;border:1px solid gold;border-radius:8px">📹 Show Video (Small)</button>
</div>

<!-- Hidden YouTube carries studio sound unlimited -->
<div id="ytWrap" style="display:none"><div id="yt"></div></div>
<iframe id="ytPlayer" style="display:none" allow="autoplay"></iframe>

<!-- MONEY - Only 2 buttons, no studio controls -->
<div style="background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin:10px">
<p style="color:gold">💛 Support The Station</p>
<button onclick="pay(10)" style="background:#ffcc00;color:black;padding:10px 18px;border-radius:8px">Pay 10 GHS Shoutout</button>
<button onclick="pay(50)" style="background:gold;color:black;padding:10px 18px;border-radius:8px">Pay 50 Join Live</button>
</div>

<p style="font-size:11px;color:#666">20k+ listeners • No app needed • Music from Main Studio Auto-Plays</p>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player; let isVideo=false;
let urlParams=new URLSearchParams(location.search);
let ytId=urlParams.get('live')||'YOUR_YOUTUBE_ID_HERE'; // Boss paste your Live ID

function onYouTubeIframeAPIReady(){
 player=new YT.Player('yt',{height:'0',width:'0',videoId:ytId,
  playerVars:{autoplay:0,controls:0},
  events:{'onReady':()=>{document.getElementById('nowPlaying').innerText='🎵 Ready - Tap PLAY above to hear Main Studio';},
          'onStateChange':(e)=>{if(e.data==1) document.getElementById('nowPlaying').innerText='🎵 LIVE from Kumasi Main Studio';}}
 });
}
function playRadio(){
 if(!player)return alert('Loading... wait 3 sec tap again');
 player.setVolume(document.getElementById('vol').value);
 player.playVideo();
 document.getElementById('playBtn').innerText='⏸️ LISTENING LIVE...';
 document.getElementById('playBtn').style.background='#0f0';
 // Wake lock - plays even when screen off (like real radio)
 if('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
}
function setVol(v){document.getElementById('v').innerText=v+'%'; if(player)player.setVolume(v);}
function toggleVideo(){
 let w=document.getElementById('ytWrap'); 
 if(!isVideo){w.style.display='block';w.innerHTML=`<iframe width="100%" height="200" src="https://www.youtube.com/embed/${ytId}?autoplay=1" style="border-radius:12px;border:2px solid gold"></iframe>`;document.getElementById('vidBtn').innerText='🔊 Audio Only';isVideo=true;}
 else{w.style.display='none';document.getElementById('vidBtn').innerText='📹 Show Video';isVideo=false;}
}
function pay(a){alert('MoMo Pay '+a+' GHS - Connect Paystack key first - Boss will bring you live after pay!');}
</script>
<style>@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}</style>
</body></html>
