<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY DAT LISTENER</title><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><style>body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0}.top{background:linear-gradient(90deg,gold,orange);color:#000;padding:12px;font-weight:bold}.box{background:#111;margin:12px;padding:16px;border-radius:16px;border:1px solid #333}.btn{padding:14px 22px;border:none;border-radius:30px;font-weight:bold;font-size:18px;width:90%}.gold{background:gold;color:#000}video{width:100%;max-height:200px;background:#000;border-radius:12px;display:none}</style></head><body>
<div class="top">👑 PLAY DAT WORLD LIVE RADIO - KUMASI GHANA 🔴 LIVE NOW</div>
<div class="box"><div style="color:gold;font-size:20px">🔊 You Are Listening To Studio Live</div><div id="st" style="margin:8px;color:#aaa">Connecting to studio...</div><br><button class="btn gold" onclick="join()">▶️ TAP TO PLAY RADIO</button><br><br><input type="range" id="vol" min="0" max="100" value="80" style="width:80%" oninput="if(aud)aud.volume=this.value/100"><div>Volume: <span id="vv">80%</span></div><br><button style="background:#000;color:#fff;border:1px solid gold;padding:8px 14px;border-radius:20px" onclick="toggleV()">📹 Show Video (Small)</button><video id="v" autoplay playsinline></video><audio id="aud" autoplay playsinline></audio></div>
<script>
let peer, call, aud=document.getElementById('aud'), vid=document.getElementById('v');
function getHost(){let u=new URLSearchParams(location.search);return u.get('host')||'PLAYDAT123'}
function join(){
 let host=getHost(); document.getElementById('st').innerText='🔗 Connecting to '+host+'...';
 peer=new Peer(); peer.on('open',()=>{
  let c=peer.call(host, new MediaStream());
  c.on('stream',s=>{
   document.getElementById('st').innerText='🔴 LIVE ON AIR!';
   aud.srcObject=s; aud.play(); vid.srcObject=s;
   document.getElementById('vv').innerText=document.getElementById('vol').value+'%';
  });
  c.on('error',()=>document.getElementById('st').innerText='❌ Studio OFFLINE - Start studio first');
 });
 peer.on('error',()=>document.getElementById('st').innerText='❌ Cannot connect - Check Host ID');
}
function toggleV(){vid.style.display=vid.style.display=='none'?'block':'none'; if(vid.style.display=='block') vid.style.display='block'; else vid.style.display='none'; if(vid.style.display=='none') vid.style.display='block';}
document.getElementById('vol').oninput=function(){aud.volume=this.value/100; document.getElementById('vv').innerText=this.value+'%'};
</script></body></html>
