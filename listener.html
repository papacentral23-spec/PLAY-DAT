<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY-DAT LIVE - LISTEN</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:10px}button{padding:18px;border-radius:15px;border:0;font-weight:900;width:95%}iframe{width:100%;height:280px;border:3px solid #facc15;border-radius:15px;display:none}#videoBox{display:none}</style></head><body>
<h1>🔴 PLAY-DAT • LIVE</h1><p id="status">Click JOIN to hear DJ</p>
<button style="background:red;color:#fff;font-size:20px" onclick="join()">▶ JOIN LIVE NOW</button><br><br>
<button style="background:yellow;color:#000;font-size:22px;padding:20px" onclick="unmute()">🔊 UNMUTE VOICE - TAP HERE</button><br><br>
<h2>🎤 NOW HEARING: <span id="now">DJ VOICE + MP3</span></h2>
<audio id="liveAudio" autoplay playsinline controls style="width:100%"></audio>
<p>🔊 Volume - If no sound, press UNMUTE above!</p><br>
<button style="background:#fff;color:#000;font-size:18px" onclick="switchVideo()">📺 SWITCH TO VIDEO - TAP HERE</button><br><br>
<div id="videoBox">
<h3>📺 DECK A -  -      </h3>
<iframe id="yt" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0"></iframe><br>
<button style="background:#facc15" onclick="switchAudio()">🎤 BACK TO VOICE ONLY</button>
</div>
<script>
let showingVideo=false;
function unmute(){let a=document.getElementById('liveAudio');a.muted=false;a.volume=1;a.play();alert('VOICE ON!');}
function switchVideo(){showingVideo=true;document.getElementById('videoBox').style.display='block';document.getElementById('yt').style.display='block';document.getElementById('yt').src='https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0';}
function switchAudio(){document.getElementById('videoBox').style.display='none';}
function join(){document.getElementById('status').innerText='Connecting...';let peer=new Peer();peer.on('open',()=>{let call=peer.call('PLAY-DAT-LIVE-1',new MediaStream());call.on('stream',s=>{document.getElementById('status').innerText='🔴 LIVE - You hear DJ VOICE + MP3 NOW!';let a=document.getElementById('liveAudio');a.srcObject=s;a.muted=false;a.volume=1;a.play();});});}
</script></body></html>
