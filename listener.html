<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY-DAT WORLD</title>
<style>
body{background:#252525;color:#D4AF37;font-family:monospace;text-align:center;padding:10px}
.player{max-width:700px;margin:15px auto;background:#2a2a2a;border:3px solid #D4AF37;border-radius:15px;padding:15px;}
.switch{display:flex;gap:10px;justify-content:center;margin:15px}
.switch button{padding:14px 10px;border-radius:10px;border:0;font-weight:900;cursor:pointer;width:48%}
.active-audio{background:#fff;color:#000} .idle{background:#2a2a2a;color:#888;border:1px solid #444}
.active-video{background:#ff4500;color:#fff} 
.video-wrapper{position:relative;width:100%;height:450px;background:#000;border-radius:12px;overflow:hidden;border:2px solid #D4AF37}
.video-wrapper iframe{position:absolute;top:-60px;left:0;width:100%;height:570px;pointer-events:none} /* Hides top YouTube bar */
.overlay{position:absolute;bottom:0;left:0;right:0;height:50px;background:#252525;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:900;letter-spacing:2px}
</style></head><body>
<h1>PLAY-DAT WORLD 🌍<br><small style="color:#888;font-size:10px">ABBEY ROAD GREY GOLD • LIVE</small></h1>
<div class="player">
<div class="switch">
<button id="btnA" class="active-audio" onclick="mode('audio')">🎵<br>AUDIO MODE<br><small>- Save Data</small></button>
<button id="btnV" class="idle" onclick="mode('video')">📹<br>VIDEO MODE<br><small>- See Studio</small></button>
</div>

<div id="audioOnly">
<h3>🔴 LIVE AUDIO - PLAY-DAT STUDIO</h3>
<audio id="ap" controls autoplay style="width:100%" src="ALHA-01.mp3"></audio>
</div>

<div id="videoOnly" class="video-wrapper" style="display:none">
<iframe src="https://www.youtube-nocookie.com/embed/id7JOjDMmEI?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&fs=0" frameborder="0" allow="autoplay"></iframe>
<div class="overlay">PLAY-DAT LIVE • GREY GOLD CONSOLE</div>
</div>

<p style="color:#D4AF37;margin-top:10px">Listeners: ∞ UNLIMITED | Switch anytime Boss!</p>
</div>
<script>
function mode(m){
 const v=document.getElementById('videoOnly'), a=document.getElementById('audioOnly'), bA=document.getElementById('btnA'), bV=document.getElementById('btnV');
 if(m=='audio'){ v.style.display='none'; a.style.display='block'; bA.className='active-audio'; bV.className='idle'; }
 else { a.style.display='none'; v.style.display='block'; bV.className='active-video'; bA.className='idle'; }
}
mode('audio');
</script>
</body></html>
