<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY-DAT WORLD</title>
<style>
body{background:#1a1a1a;color:#D4AF37;font-family:monospace;text-align:center;margin:0;padding:10px}
.player{max-width:700px;margin:10px auto;background:#2a2a2a;border:3px solid #D4AF37;border-radius:18px;padding:12px}
.switch{display:flex;gap:10px;justify-content:center;margin:12px}
.switch button{padding:12px;border-radius:10px;border:0;font-weight:900;width:48%;font-size:13px}
.btnA{background:#fff;color:#000} .btnV{background:#ff4400;color:#fff} .btnIdle{background:#333;color:#888;border:1px solid #444}
.wrap{position:relative;width:100%;height:520px;background:#000;border-radius:14px;overflow:hidden;border:2px solid #D4AF37}
.wrap iframe{position:absolute;top:50%;left:50%;width:178%;height:100%;transform:translate(-50%,-50%);border:0}
.watermark{position:absolute;top:10px;left:10px;z-index:5;background:rgba(0,0,0,0.7);border:1px solid #D4AF37;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:5px}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;height:42px;background:linear-gradient(0deg,#000 80%,transparent);z-index:5;display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:2px;font-size:12px;color:#D4AF37}
.top-mask{position:absolute;top:0;left:0;right:0;height:60px;background:#000;z-index:4}
</style></head><body>
<h2 style="margin:5px;color:#D4AF37;letter-spacing:2px">PLAY-DAT WORLD 🌍</h2>
<p style="color:#888;font-size:10px;margin:0;letter-spacing:3px">ABBEY ROAD GREY GOLD • LIVE</p>
<div class="player">
<div class="switch">
<button id="bA" class="btnA" onclick="go('a')">🎵 AUDIO MODE<br><small>Save Data</small></button>
<button id="bV" class="btnIdle" onclick="go('v')">📹 VIDEO MODE<br><small>See Studio</small></button>
</div>
<div id="aBox"><audio controls autoplay style="width:100%;height:50px" src="ALHA-01.mp3"></audio></div>
<div id="vBox" class="wrap" style="display:none">
<div class="top-mask"></div>
<div class="watermark">🟡 PLAY-DAT WORLD</div>
<iframe src="https://www.youtube-nocookie.com/embed/id7JOjDMmEI?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&fs=0&playsinline=1"></iframe>
<div class="bottom-bar">PLAY-DAT LIVE • GREY GOLD CONSOLE</div>
</div>
<p style="color:#D4AF37;font-size:11px;margin-top:10px">Listeners: ∞ UNLIMITED | Switch anytime Boss!</p>
</div>
<script>
function go(m){const a=document.getElementById('aBox'),v=document.getElementById('vBox'),bA=document.getElementById('bA'),bV=document.getElementById('bV');if(m=='a'){a.style.display='block';v.style.display='none';bA.className='btnA';bV.className='btnIdle'}else{a.style.display='none';v.style.display='block';bA.className='btnIdle';bV.className='btnV'}}
go('v');
</script>
</body></html>
