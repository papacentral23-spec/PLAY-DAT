<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT STUDIO</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;text-align:center}
.top{background:gold;color:#000;padding:10px;font-weight:bold;display:flex;justify-content:space-between}
.box{background:#151515;margin:10px;padding:12px;border-radius:12px;border:1px solid #333}
input{padding:10px;border-radius:8px;border:1px solid gold;background:#000;color:#fff;width:65%}
.btn{padding:10px 18px;border:none;border-radius:20px;font-weight:bold;margin:4px}
.gold{background:gold;color:#000}.green{background:#0f0}.red{background:red;color:#fff}.blue{background:#0af;color:#fff}
video{width:100%;max-height:180px;background:#000;border-radius:10px}
.switch{padding:12px 0;display:flex;justify-content:space-around}
</style></head><body>
<div class="top"><span>👑 PLAY DAT STUDIO</span><span id="dot">⚫ OFFLINE</span></div>
<div class="box">
<input id="hostId" value="PLAYDAT999">
<button class="btn gold" onclick="startStudio()">START</button>
<div id="stat" style="color:#aaa;font-size:12px;margin-top:6px">Type ID → START</div>
<button class="btn green" id="goBtn" onclick="goLive()" style="display:none">🔴 GO LIVE</button>
<button class="btn red" id="stopBtn" onclick="stopLive()" style="display:none">⏹️ STOP</button>
</div>
<div class="box">
<video id="localV" autoplay muted playsinline></video>
<div class="switch">
<button class="btn blue" id="voiceBtn" onclick="toggleVoice()">🎤 VOICE: ON</button>
<button class="btn gold" id="musicBtn" onclick="toggleMusic()">🎵 MUSIC: OFF</button>
</div>
<div>👥 Listeners: <span id="cnt">0</span> | 🎧 <span id="mode">VOICE MODE</span></div>
<audio id="mp3Player" controls style="width:100%;margin-top:8px"></audio>
<input type="file" id="mp3File" accept="audio/*">
</div>
<script>
let peer, myStream, mp3Stream, audioCtx, connections=[];
let voiceOn=true, musicOn=false;
let voiceTrack, combinedStream;
async function startStudio(){
 myStream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:360},audio:{channelCount:2,echoCancellation:false,autoGainControl:false,noiseSuppression:false,sampleRate:48000}});
 document.getElementById('localV').srcObject=myStream;
 voiceTrack=myStream.getAudioTracks()[0];
 document.getElementById('mp3File').addEventListener('change',e=>{
  let file=e.target.files[0]; if(!file) return;
  let url=URL.createObjectURL(file); let p=document.getElementById('mp3Player'); p.src=url;
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  let src=audioCtx.createMediaElementSource(p); let dest=audioCtx.createMediaStreamDestination();
  src.connect(dest); src.connect(audioCtx.destination); mp3Stream=dest.stream;
 });
 peer=new Peer(document.getElementById('hostId').value.trim()||'PLAYDAT999');
 peer.on('open',()=>{document.getElementById('dot').innerText='🟠 READY';document.getElementById('stat').innerText='✅ TAP GO LIVE';document.getElementById('goBtn').style.display='inline-block';});
 peer.on('call',call=>{
  updateStream(); call.answer(combinedStream||myStream); connections.push(call); document.getElementById('cnt').innerText=connections.length;
 });
}
function updateStream(){
 let audioTracks=[]; if(voiceOn && voiceTrack) audioTracks.push(voiceTrack); if(musicOn && mp3Stream) audioTracks.push(...mp3Stream.getAudioTracks());
 combinedStream=new MediaStream([...myStream.getVideoTracks(),...audioTracks]);
 connections.forEach(c=>{ let sender=c.peerConnection.getSenders().find(s=>s.track&&s.track.kind==='audio'); if(sender) sender.replaceTrack(audioTracks[0]||null); });
}
function toggleVoice(){voiceOn=!voiceOn; document.getElementById('voiceBtn').innerText=voiceOn?'🎤 VOICE: ON':'🔇 VOICE: OFF'; document.getElementById('voiceBtn').style.background=voiceOn?'#0af':'#555'; updateStream(); document.getElementById('mode').innerText=voiceOn?(musicOn?'VOICE+MUSIC':'VOICE MODE'):'MUSIC ONLY';}
function toggleMusic(){let p=document.getElementById('mp3Player'); if(!musicOn){if(!p.src){alert('Load MP3 first!');return;} p.play();}else{p.pause();} musicOn=!musicOn; document.getElementById('musicBtn').innerText=musicOn?'🎵 MUSIC: ON':'🎵 MUSIC: OFF'; updateStream(); document.getElementById('mode').innerText=voiceOn?(musicOn?'VOICE+MUSIC':'VOICE MODE'):'MUSIC ONLY';}
function goLive(){document.getElementById('dot').innerText='🔴 LIVE STEREO';document.getElementById('stat').innerText='🔴 LIVE!';document.getElementById('goBtn').style.display='none';document.getElementById('stopBtn').style.display='inline-block';}
function stopLive(){peer.destroy();document.getElementById('dot').innerText='⚫ OFFLINE';}
</script></body></html>
