<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PLAY-DAT WORLD</title>
<style>
*{box-sizing:border-box}body{background:#0e0e0e;color:#D4AF37;font-family:monospace;text-align:center;margin:0;padding:6px}
.player{max-width:800px;margin:0 auto;background:#1e1e1e;border:3px solid #D4AF37;border-radius:20px;padding:8px}
.switch{display:flex;gap:8px;margin:8px 0}.switch button{flex:1;padding:12px;border-radius:12px;border:0;font-weight:900;font-size:13px}
.btnA{background:#fff;color:#000}.btnV{background:#ff4400;color:#fff}.btnIdle{background:#2c2c2c;color:#777;border:1px solid #444}
.wrap{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden;border:2px solid #D4AF37}
/* PORTRAIT - ZOOM TO FILL - NO BLACK */
@media (orientation: portrait){
.wrap{height:80vh}
.wrap iframe{position:absolute;top:50%;left:50%;width:220%;height:220%;transform:translate(-50%,-50%);border:0}
}
/* LANDSCAPE - FILL WIDE */
@media (orientation: landscape){
.wrap{height:68vh}
.wrap iframe{position:absolute;top:50%;left:50%;width:100%;height:220%;transform:translate(-50%,-50%);border:0}
}
.watermark{position:absolute;top:10px;left:10px;z-index:10;background:rgba(0,0,0,0.9);border:1.5px solid #D4AF37;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:900;color:#D4AF37}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;height:36px;background:#000;z-index:10;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;letter-spacing:2px;color:#D4AF37;border-top:1.5px solid #D4AF37}
</style></head><body>
<div style="padding:6px"><h2 style="margin:0;letter-spacing:3px;color:#D4AF37">PLAY-DAT WORLD 🌍</h2><p style="color:#888;font-size:9px;letter-spacing:4px;margin:2px">ABBEY ROAD GREY GOLD • LIVE</p></div>
<div class="player">
<div class="switch">
<button id="bA" class="btnA" onclick="go('a')">🎵 AUDIO MODE<br><small>Save Data</small></button>
<button id="bV" class="btnIdle" onclick="go('v')">📹 VIDEO MODE<br><small>See Studio</small></button>
</div>
<div id="aBox"><audio controls autoplay style="width:100%;height:48px;border-radius:10px" src="ALHA-01.mp3"></audio></div>
<div id="vBox" class="wrap" style="display:none">
<div class="watermark">🟡 PLAY-DAT WORLD</div>
<iframe src="https://www.youtube-nocookie.com/embed/id7JOjDMmEI?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1&showinfo=0" allow="autoplay;encrypted-media"></iframe>
<div class="bottom-bar">PLAY-DAT LIVE • GREY GOLD CONSOLE • Salt 95.9FM</div>
</div>
<p style="font-size:9px;margin:8px 0 0;color:#D4AF37">∞ UNLIMITED LISTENERS • ROTATE PHONE AUTO-FILL</p>
</div>
<script>function go(m){const a=document.getElementById('aBox'),v=document.getElementById('vBox'),bA=document.getElementById('bA'),bV=document.getElementById('bV');if(m=='a'){a.style.display='block';v.style.display='none';bA.className='btnA';bV.className='btnIdle'}else{a.style.display='none';v.style.display='block';bA.className='btnIdle';bV.className='btnV'}}go('v')</script>
</body></html>
