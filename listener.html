<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY-DAT LISTENER</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>body{background:#1a1a1a;color:#fff;font-family:Arial;margin:0}.top{background:linear-gradient(90deg,#C9A227,#FFD700,#C9A227);color:#111;padding:14px;font-weight:900;font-size:22px;text-align:center}.box{background:#2e2e2e;border:1.5px solid #FFD700;margin:12px;border-radius:14px;padding:12px}button{background:#FFD700;color:#111;padding:16px 30px;border-radius:25px;border:0;font-weight:900;font-size:18px;width:90%}iframe{width:100%;height:250px;border:0;border-radius:10px}audio{width:100%}</style></head><body>
<div class="top">PLAY-DAT WORLD</div><div class="box"><p id="s" style="color:#b0b0b0">⚪ OFFLINE - Press JOIN</p><iframe src="https://www.youtube.com/embed/id7JOjDMmEI?autoplay=1&mute=0" allow="autoplay"></iframe><div style="background:#FFD700;color:#111;padding:9px;font-weight:900;margin-top:8px;border-radius:6px">▶ PLAY-DAT 🔴 LIVE</div><p style="color:#FFD700">🎧 VIDEO + VOICE + MP3 - ALWAYS</p><audio id="aud" controls autoplay></audio><br><button onclick="join()">▶ JOIN LIVE NOW - ALWAYS</button></div>
