<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT -  </title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial;margin:0}
.top{background:#D4AF37;color:#000;padding:14px;font-weight:900}
.card{background:#111;border:2px solid #D4AF37;border-radius:20px;margin:15px;padding:18px}
.play{background:linear-gradient(90deg,#FFD700,#D4AF37);color:#000;border:none;padding:16px 45px;border-radius:50px;font-size:20px;font-weight:900}
.switch{display:flex;gap:6px;margin-top:12px}
.switch button{flex:1;padding:11px;border-radius:20px;border:1px solid #D4AF37;background:#222;color:#D4AF37;font-weight:bold}
.switch button.active{background:#D4AF37;color:#000}
audio,video{width:100%;margin-top:12px;border-radius:12px}
video{height:220px;display:none}
</style>
</head>
<body>
<div class="top">👑 PLAY DAT WORLD - </div>
<div class="card">
<h2 style="color:#FFD700;margin:5px">🔊 TAP TO JOIN LIVE</h2>
<p id="status" style="color:#888;font-size:12px">Connect to Studio Live + Files</p>
<button class="play" id="btn" onclick="joinLive()">▶️ JOIN LIVE NOW</button>
<video id="vid" controls playsinline></video>
<audio id="au" controls autoplay></audio>
<audio id="liveAu" controls autoplay style="display:none"></audio>

<div class="switch">
<button id="bLive" class="active" onclick="setMode('live')">🔴 LIVE</button>
<button id="bVideo" onclick="setMode('video')">📹 VIDEO</button>
<button id="bVoice" onclick="setMode('voice')">🎙️ VOICE</button>
<button id="bMusic" onclick="setMode('music')">🎵 MUSIC</button>
</div>
<p style="font-size:10px;color:#555;margin-top:8px">V6 - Studio + Guest + Listener Connected</p>
</div>
<script>
let peer, mode='live';
let media={video:"video.mp4",voice:"voice.mp3",music:"ALHA-01.mp3"};

function joinLive(){
 peer=new Peer({config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
 peer.on('open', ()=>{
  document.getElementById('status').innerText='Connecting to studio...';
  // Try to find studio - you must replace with real ID or use fixed
  let studioId=prompt('Enter Studio ID if you have, or tap Cancel for file mode:');
  if(studioId){
   let call=peer.call(studioId, new MediaStream(), {metadata:{type:'listener'}});
   call.on('stream', s=>{
    document.getElementById('liveAu').style.display='block';
    document.getElementById('liveAu').srcObject=s;
    document.getElementById('status').innerText='✅ LIVE FROM STUDIO - Hearing DJ + Guest!';
    document.getElementById('btn').innerText='🔴 LIVE CONNECTED';
    document.getElementById('btn').style.background='#0f0';
    setMode('live');
   });
  } else {
   setMode('voice');
   document.getElementById('status').innerText='Playing files - For live, need Studio ID';
  }
 });
}

function setMode(m){
 mode=m;
 document.querySelectorAll('.switch button').forEach(b=>b.classList.remove('active'));
 document.getElementById('b'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');

 let au=document.getElementById('au');
 let vid=document.getElementById('vid');
 let liveAu=document.getElementById('liveAu');

 if(m=='live'){
  au.style.display='none'; vid.style.display='none'; liveAu.style.display='block';
  document.getElementById('status').innerText='🔴 LIVE MODE - Studio + Guest';
 } else if(m=='video'){
  liveAu.style.display='none'; au.style.display='none'; vid.style.display='block';
  vid.src=media.video; vid.play();
 } else {
  liveAu.style.display='none'; vid.style.display='none'; au.style.display='block';
  au.src=media[m]; au.play();
  document.getElementById('status').innerText='Playing: '+m;
 }
}
</script>
</body>
</html>
