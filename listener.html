<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PLAY-DAT - GUEST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:1.5vw}
.top{background:#e0c36a;color:#000;padding:9px;font-weight:900;font-size:15px}
.sub{color:#e0c36a;font-size:10px;letter-spacing:2px;margin:4px}
.box{max-width:650px;margin:8px auto;background:#151515;border:1px solid #e0c36a;border-radius:12px;padding:10px}
input{padding:9px;border-radius:8px;border:0;font-size:14px;text-align:center;font-weight:900;width:75%}
.btn{background:#e0c36a;color:#000;padding:10px 20px;border:0;border-radius:20px;font-weight:900;margin:5px;cursor:pointer}
.btn.red{background:#ff2222;color:#fff;width:90%;padding:13px}
.btn.green{background:#00ff00;color:#000;width:90%;padding:13px}
.btn.active{background:#00ff00!important;color:#000!important}
.videoWrap{position:relative;width:100%;background:#000;border-radius:8px;overflow:hidden;border:1px solid #333}
.videoWrap iframe{width:100%;height:260px;border:0;display:block}
.coverTop{position:absolute;left:0;top:0;background:#000;color:#e0c36a;padding:4px 9px;font-weight:900;font-size:11px;z-index:10;border-radius:0 0 8px 0}
.coverYT{position:absolute;right:0;bottom:36px;background:#000;color:#e0c36a;padding:8px 16px;font-weight:900;font-size:12px;z-index:30;border-radius:8px 0 0 0}
audio{width:100%}
video{width:100%;background:#000;border-radius:8px}
.range{width:100%;accent-color:#e0c36a;height:24px}
#status{color:#0f0;font-weight:900;font-size:12px;margin:5px}
.guestWrap{position:relative;width:100%;background:#000;border-radius:8px;overflow:hidden;border:2px solid #e0c36a;min-height:220px}
.guestWrap video{width:100%;height:260px;object-fit:cover;display:block}
.guestNameTag{position:absolute;left:0;bottom:0;background:#e0c36a;color:#000;padding:6px 14px;font-weight:900;font-size:13px;z-index:10;border-radius:0 8px 0 0}
.guestLiveTag{position:absolute;right:0;top:0;background:#ff0000;color:#fff;padding:5px 12px;font-weight:900;font-size:12px;z-index:10;display:none}
.guestLiveTag.show{display:block}
.waiting{background:#000;border:1px dashed #e0c36a;padding:8px;border-radius:8px;font-size:12px;color:#ffaa00;font-weight:900;margin:5px 0}
</style>
</head>
<body>
<div class="top">                 </div>
<div class="sub">PLAY-DAT -               </div>
<div id="status">👋 -             </div>

<div class="box">
<b style="color:#e0c36a">🎤 GUEST - YOUR NAME</b><br><br>
<input id="guestName" placeholder="Type your name - e.g PAPA, DJ JOE" value="GUEST 1"><br>
<button class="btn" onclick="saveName()">SAVE NAME</button>
</div>

<div class="box">
<b style="color:#e0c36a">📷 GUEST - CAMERA -              </b><br><br>
<div class="guestWrap">
<div id="guestPlace" style="padding:80px 10px;color:#888;font-weight:900">📷 GUEST CAMERA OFF<br>Click JOIN LIVE</div>
<video id="gv" autoplay playsinline muted></video>
<div class="coverTop">PLAY-DAT ● LIVE</div>
<div class="guestNameTag">🎤 <span id="guestNameShow">GUEST 1</span></div>
<div class="guestLiveTag" id="guestLiveTag">🔴 LIVE ON AIR</div>
<div style="position:absolute;right:0;bottom:0;background:#000;color:#e0c36a;padding:5px 10px;font-weight:900;font-size:11px;z-index:10">▶ PLAY-DAT</div>
</div>
<br>
<div>Guest Mic Vol <span id="guestVolVal">100%</span></div>
<input type="range" class="range" id="guestVol" min="0" max="200" value="100" oninput="updateVol()"><br>
<button class="btn green" id="guestBtn" onclick="connectGuest()">🎤 JOIN LIVE - CAMERA ON</button>
<button class="btn" id="muteBtn" onclick="muteGuest()">🔇 MUTE ME</button>
<button class="btn red" onclick="kickGuest()">❌ LEAVE</button>
<div class="waiting" id="waitBox">⏳ WAITING FOR  SIRTO BRING  LIVE...</div>
</div>

<div class="box">
<b style="color:#e0c36a">💬 CHAT TO DJ</b><br><br>
<input id="chatMsg" placeholder="Type message to DJ...">
<button class="btn" onclick="sendChat()">SEND</button>
<div id="chatBox" style="text-align:left;font-size:13px;margin-top:8px"></div>
</div>

<div class="box">
<b style="color:#e0c36a">🔊 HEAR STUDIO - ALHA-01</b><br><br>
<audio controls src="ALHA-01.mp3"></audio>
<p style="font-size:11px;color:#aaa">Same song as Studio Deck B</p>
</div>

<div class="box">
<b style="color:#e0c36a">🔙 BACK TO STUDIO</b><br>
<button class="btn" onclick="location.href='studio.html'">GO TO STUDIO</button>
<button class="btn" onclick="location.href='listener.html'">GO TO LISTENER</button>
</div>

<script>
let stream=null, myName='GUEST 1', muted=false;
function saveName(){myName=document.getElementById('guestName').value||'GUEST 1'; document.getElementById('guestNameShow').innerText=myName; document.getElementById('status').innerText='✅ Hello '+myName+'! Ready!'; localStorage.setItem('playdat_guest',myName);}
async function connectGuest(){
 saveName();
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  let v=document.getElementById('gv'); v.srcObject=stream; v.muted=true;
  document.getElementById('guestPlace').style.display='none';
  document.getElementById('guestBtn').innerText='✅ CONNECTED - WAITING FOR DJ'; document.getElementById('guestBtn').classList.add('active');
  document.getElementById('status').innerText='✅ '+myName+' CONNECTED';
  document.getElementById('waitBox').innerText='✅ CONNECTED! DJ can see you - Wait for BRING LIVE'; document.getElementById('waitBox').style.color='#0f0';
  setTimeout(()=>{document.getElementById('guestLiveTag').classList.add('show'); document.getElementById('status').innerText='🔴 '+myName+' YOU ARE LIVE ON PLAY-DAT!'; document.getElementById('waitBox').innerText='🔴 YOU ARE LIVE ON AIR NOW!';},5000);
 }catch(e){alert('Allow camera + mic! '+e.message)}
}
function updateVol(){document.getElementById('guestVolVal').innerText=document.getElementById('guestVol').value+'%';}
function muteGuest(){muted=!muted; if(stream) stream.getAudioTracks().forEach(t=>t.enabled=!muted); document.getElementById('muteBtn').innerText=muted?'🔊 UNMUTE ME':'🔇 MUTE ME'; document.getElementById('status').innerText=muted?'🔇 You muted':'🔊 You unmuted';}
function kickGuest(){if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; document.getElementById('gv').srcObject=null; document.getElementById('guestPlace').style.display='block'; document.getElementById('guestLiveTag').classList.remove('show'); document.getElementById('guestBtn').innerText='🎤 JOIN LIVE - CAMERA ON'; document.getElementById('guestBtn').classList.remove('active'); document.getElementById('status').innerText='👋 You left';}
function sendChat(){let m=document.getElementById('chatMsg').value; if(!m) return; document.getElementById('chatBox').innerHTML+='<div><b style="color:#e0c36a">'+myName+':</b> '+m+'</div>'; document.getElementById('chatMsg').value='';}
let saved=localStorage.getItem('playdat_guest'); if(saved){document.getElementById('guestName').value=saved; document.getElementById('guestNameShow').innerText=saved; myName=saved;}
</script>
</body>
</html>
