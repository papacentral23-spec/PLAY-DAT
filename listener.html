<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT -
</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial;margin:0}
.top{background:#D4AF37;color:#000;padding:14px;font-weight:900}
.card{background:#111;border:2px solid #D4AF37;border-radius:20px;margin:12px;padding:15px}
.play{background:linear-gradient(90deg,#FFD700,#D4AF37);color:#000;border:none;padding:16px 40px;border-radius:50px;font-size:20px;font-weight:900}
.live{background:red;color:#fff;padding:4px 10px;border-radius:12px;font-size:11px}
audio,video{width:100%;margin-top:12px;border-radius:12px;background:#000}
video{height:220px;display:none}
.switch{display:flex;gap:6px;margin-top:12px}
.switch button{flex:1;padding:11px;border-radius:20px;border:1px solid #D4AF37;background:#222;color:#D4AF37;font-weight:bold;font-size:13px}
.switch button.active{background:#D4AF37;color:#000}
</style>
</head>
<body>
<div class="top">👑 PLAY DAT WORLD - 

<span class="live">● LIVE</span></div>

<div class="card">
<h2 style="color:#FFD700;margin:5px">🔊 TAP TO PLAY</h2>
<p id="status" style="color:#888;font-size:12px">Choose VIDEO or VOICE or MUSIC</p>

<button class="play" id="btn" onclick="playNow()">▶️ PLAY NOW</button>

<video id="vid" controls playsinline></video>
<audio id="au" controls></audio>

<div class="switch">
<button id="bVideo" onclick="setMode('video')">📹 VIDEO</button>
<button id="bVoice" class="active" onclick="setMode('voice')">🎙️ VOICE</button>
<button id="bMusic" onclick="setMode('music')">🎵 MUSIC</button>
</div>

<p style="font-size:10px;color:#555;margin-top:8px">V5 Switch
  
  - </p>
</div>

<script>
// YOUR FILES - Put these MP4/MP3 in GitHub repo
let media = {
 video: "video.mp4", // Your video (upload small 10MB)
 voice: "voice.mp3", // Your voice talk
 music: "ALHA-01.mp3" // Your music
};

let mode='voice';

function playNow(){
 setMode(mode);
 document.getElementById('btn').innerText='🔊 PLAYING';
 document.getElementById('btn').style.background='#0f0';
}

function setMode(m){
 mode=m;
 let au=document.getElementById('au');
 let vid=document.getElementById('vid');
 let status=document.getElementById('status');

 document.getElementById('bVideo').classList.toggle('active',m=='video');
 document.getElementById('bVoice').classList.toggle('active',m=='voice');
 document.getElementById('bMusic').classList.toggle('active',m=='music');

 if(m=='video'){
  au.style.display='none';
  vid.style.display='block';
  vid.src=media.video;
  vid.play();
  status.innerText='📹 VIDEO + VOICE MODE - Seeing + Hearing';
 } else {
  vid.style.display='none';
  vid.pause();
  au.style.display='block';
  au.src=media[m];
  au.play();
  status.innerText= m=='voice'? '🎙️ VOICE MODE - Hearing DJ Live' : '🎵 MUSIC MODE - Playing Songs';
 }
}
</script>
</body>
