<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAY DAT WORLD</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px;margin:0}
.header{padding:15px}
.btn{padding:12px 18px;margin:5px;border-radius:25px;border:none;font-weight:bold;cursor:pointer;font-size:14px}
.mode{background:#222;color:#fff;border:2px solid #444}
.mode.active{background:#ff0066;border-color:#ff0066;box-shadow:0 0 10px #ff0066}
#playerBox{width:100%;max-width:500px;height:280px;background:#111;margin:15px auto;border-radius:15px;overflow:hidden;position:relative;transition:all 0.3s}
#playerBox.voice{height:80px;background:#222}
#playerBox.voice iframe{opacity:0.05;pointer-events:none}
iframe{width:100%;height:100%;border:none}
#status{color:#00ff66;margin:10px;font-weight:bold}
.logo{font-size:28px;font-weight:bold;color:#ff0066}
</style>
</head>
<body>
<div class="header">
<div class="logo">📻 PLAY DAT WORLD</div>
<p>COMMITTED TO QUALITY</p>
<p id="status">🔴 LIVE ON AIR</p>
</div>

<div id="playerBox">
<iframe id="ytPlayer" src="https://www.youtube.com/embed/id7JOjDMmEI?autoplay=1&mute=0&controls=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<div>
<button class="btn mode active" id="btnLIVE" onclick="setMode('LIVE')">🔴 LIVE</button>
<button class="btn mode" id="btnVOICE" onclick="setMode('VOICE')">🎙️ VOICE ONLY</button>
<button class="btn mode" id="btnVIDEO" onclick="setMode('VIDEO')">📹 VIDEO</button>
<button class="btn mode" id="btnMUSIC" onclick="setMode('MUSIC')">🎵 MUSIC</button>
</div>

<p style="margin-top:20px;color:#aaa;font-size:13px">🎧 Voice Only saves data | 📹 Video shows studio</p>
<p style="color:#555;font-size:11px">ID: PLAY-DAT-STUDIO-14 | 
</p>

<audio id="musicPlayer" src="ALHA-01.mp3" loop></audio>

<script>
let mode='LIVE';
const box=document.getElementById('playerBox');
const yt=document.getElementById('ytPlayer');
const music=document.getElementById('musicPlayer');
const status=document.getElementById('status');

function setMode(m){
 mode=m;
 document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));
 document.getElementById('btn'+m).classList.add('active');

 if(m==='VOICE'){
   box.classList.add('voice');
   box.style.display='block';
   music.pause();
   yt.style.display='block';
   status.innerText='🎙️ VOICE ONLY - Audio Live (Data Saver)';
   status.style.color='#00ff66';
 }else if(m==='VIDEO'){
   box.classList.remove('voice');
   box.style.display='block';
   box.style.height='280px';
   yt.style.display='block';
   music.pause();
   status.innerText='📹 VIDEO LIVE';
   status.style.color='#ff0066';
 }else if(m==='MUSIC'){
   box.style.display='none';
   music.play();
   status.innerText='🎵 PLAYING ALHA-01.mp3';
   status.style.color='#ffaa00';
 }else{ // LIVE
   box.classList.remove('voice');
   box.style.display='block';
   box.style.height='280px';
   yt.style.display='block';
   music.pause();
   status.innerText='🔴 LIVE - Everything';
   status.style.color='#00ff66';
 }
}
</script>
</body>
</html>
