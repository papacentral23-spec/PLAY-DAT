<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PLAY-DAT LISTENER -      </title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center;padding:3vw}
h1{font-size:clamp(22px,6vw,38px);color:#e0c36a;letter-spacing:3px;margin:5px}
.sub{font-size:clamp(10px,3vw,13px);color:#bbb}
.box{max-width:800px;margin:10px auto;background:#151515;border:2px solid #e0c36a;border-radius:14px;padding:clamp(10px,3vw,16px)}
.btn{width:90%;max-width:350px;padding:14px;margin:6px;border-radius:25px;border:0;font-weight:900;font-size:15px;cursor:pointer}
.btn.gold{background:#e0c36a;color:#000}
.btn.red{background:#ff2222;color:#fff}
.btn.white{background:#fff;color:#000}
iframe{width:100%;border-radius:10px;border:2px solid #e0c36a}
audio{width:100%}
input[type=range]{width:100%;accent-color:#e0c36a;height:30px}
.live{color:#ff2222;font-weight:900;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.locked{font-size:11px;color:#ff5555;font-weight:900}
</style>
</head>
<body>
<h1>PLAY-DAT WORLD</h1>
<div class="sub">MAZTUBE78 x PLAY-DAT - Radio + Video LIVE</div>
<div class="live">● LIVE NOW</div>
<div class="locked">🔒 LISTEN.      - 
  
     /     </div>

<div class="box">
<b>CHOOSE -          </b><br><br>
<button class="btn gold" onclick="showVideo()">📺 WATCH VIDEO - YouTube</button>
<button class="btn white" onclick="showAudio()">🔊 LISTEN AUDIO ONLY - Save Data</button>
<button class="btn gold" onclick="showVoice()">🎤 LISTEN ALHA-01 VOICE</button>
</div>

<div class="box">
<b id="playerTitle">▶️ NOW PLAYING -          </b><br><br>
<iframe id="ytFrame" height="220" src="https://www.youtube.com/embed/id7JOjDMmEI" allowfullscreen></iframe>
<audio id="voiceAudio" controls style="display:none"><source src="ALHA-01.mp3"></audio>
</div>

<div class="box">
<b>LOUD FOR LISTENER 🔊</b><br>
<input type="range" id="vol" min="0" max="200" value="120" oninput="setVol(this.value)">
<div id="volTxt">Volume: 120% - LOUD MODE ON</div><br>
<button class="btn gold" onclick="toggleAnalog()">ANALOG WARMTH: ON</button>
<button class="btn red" onclick="goLoud()">🔥 +12dB</button>
</div>

<div class="box">
<b>📲 SHARE TO FRIENDS</b><br>
<button class="btn gold" onclick="share()">SHARE PLAY-DAT - LISTEN </button>
<div style="font-size:11px;color:#888">https://papacentral23.github.io/papacentral23-spec/listener.html</div>
</div>

<script>
let analog=true;
function showVideo(){document.getElementById('ytFrame').style.display='block';document.getElementById('voiceAudio').style.display='none';document.getElementById('playerTitle').textContent='▶️ NOW PLAYING - VIDEO';}
function showAudio(){document.getElementById('ytFrame').style.display='none';document.getElementById('voiceAudio').style.display='block';document.getElementById('voiceAudio').play();document.getElementById('playerTitle').textContent='🔊 NOW PLAYING - AUDIO ONLY';}
function showVoice(){document.getElementById('ytFrame').style.display='none';document.getElementById('voiceAudio').style.display='block';document.getElementById('voiceAudio').play();document.getElementById('playerTitle').textContent='🎤 ALHA-01 VOICE LIVE';}
function setVol(v){document.getElementById('volTxt').textContent='Volume: '+v+'% - '+(v>100?'LOUD MODE ON':'Normal')}
function toggleAnalog(){analog=!analog;alert('Analog Warmth '+(analog?'ON':'OFF'))}
function goLoud(){document.getElementById('vol').value=200;setVol(200);alert('LOUD +12dB!')}
function share(){let link='https://papacentral23.github.io/papacentral23-spec/listener.html'; if(navigator.share) navigator.share({title:'PLAY-DAT LIVE',url:link}); else prompt('Copy Listener Link:',link)}
</script>
</body>
</html>
