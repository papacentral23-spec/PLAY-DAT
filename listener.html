<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Listeners - PLAY DAT WORLD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;padding:20px;text-align:center}
h1{color:#FFD700;font-size:28px}
.live-dot{display:inline-block;width:10px;height:10px;background:#0f0;border-radius:50%;animation:blink 1s infinite;margin-right:8px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.card{max-width:500px;margin:20px auto;background:#111;border:1px solid #D4AF37;border-radius:15px;padding:20px}
.big{font-size:52px;font-weight:900;color:#FFD700}
.count{color:#888;margin-top:5px}
.listener{display:flex;align-items:center;background:#1a1a1a;padding:12px;margin:10px 0;border-radius:10px;text-align:left}
.flag{font-size:24px;margin-right:12px}
a.btn{display:inline-block;margin-top:20px;padding:12px 25px;background:linear-gradient(90deg,#FFD700,#D4AF37);color:#000;font-weight:900;text-decoration:none;border-radius:25px}
</style>
</head>
<body>
<h1><span class="live-dot"></span>LIVE LISTENERS</h1>
<p style="color:#888;margin-top:5px">PLAY DAT WORLD - Kumasi to the World 🇬🇭</p>

<div class="card">
<div class="big" id="total">24</div>
<div class="count">People listening now</div>
<div style="margin-top:15px;color:#0f0;font-weight:700">● ON AIR - Studio 7</div>
</div>

<div class="card" style="text-align:left">
<h3 style="color:#FFD700;margin-bottom:10px">Recent Listeners</h3>
<div id="list"></div>
</div>

<a class="btn" href="index.html">← Back to World</a>

<script>
// Fake live listeners - updates every 3 sec
const places=[
 {f:"🇬🇭",n:"Kwame from Kumasi"},
 {f:"🇬🇭",n:"Ama from Accra"},
 {f:"🇳🇬",n:"Chidi from Lagos"},
 {f:"🇬🇧",n:"Sarah from London"},
 {f:"🇺🇸",n:"Mike from New York"},
 {f:"🇬🇭",n:"Kofi from Obuasi"},
 {f:"🇩🇪",n:"Hans from Berlin"},
 {f:"🇬🇭",n:"Yaa from Santasi"}
];

function render(){
 let html="";
 places.slice(0,5).forEach(p=>{
  html+=`<div class="listener"><span class="flag">${p.f}</span><div><b>${p.n}</b><br><small style="color:#0f0">● Listening</small></div></div>`;
 });
 document.getElementById('list').innerHTML=html;
 // random count 18-45
 document.getElementById('total').innerText = Math.floor(18+Math.random()*28);
}
render();
setInterval(render,3000);

// Count YOU as listener
let c = localStorage.getItem('playdat_visits')||0;
c++; localStorage.setItem('playdat_visits',c);
</script>
</body>
</html>
