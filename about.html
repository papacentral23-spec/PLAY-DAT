<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STUDIO 7 GOLD - PLAY DAT</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:system-ui}.top{padding:12px 16px;background:#0a0a0a;border-bottom:1px solid #D4AF3722;display:flex;justify-content:space-between;align-items:center}.nav{display:flex;gap:12px;font-size:13px;font-weight:800}.nav a{padding:6px 12px;border-radius:20px;color:#D4AF37;text-decoration:none}.nav a.active{background:#D4AF37;color:#000}.wrap{padding:16px}.card{background:#0e0e0e;border:2px solid #D4AF37CC;border-radius:18px;padding:16px;margin-bottom:14px}.btn{width:100%;padding:14px;border-radius:12px;font-weight:900;margin:6px 0;border:none}.gold{background:linear-gradient(180deg,#FFD700,#D4AF37);color:#000}.dark{background:#111;color:#D4AF37;border:2px solid #D4AF37}input[type=file]{display:none}.song{background:#1a1700;padding:10px;border-radius:8px;margin:6px 0;border-left:4px solid #D4AF37;display:flex;justify-content:space-between}</style></head><body><div class="top"><b style="color:#D4AF37">👑 STUDIO 7 GOLD</b><div class="nav"><a href="index.html">LISTEN</a><a class="active" href="studio7.html">STUDIO</a><a href="about.html">ABOUT</a></div></div><div class="wrap"><div class="card"><h3 style="color:#D4AF37">● DJ CONTROL - BROADCAST</h3><p style="color:#888;font-size:13px;margin:6px 0">Add MP3 -> Auto plays on LISTEN page | Committed To Quality</p><button class="btn gold" onclick="document.getElementById('f').click()">+ ADD MP3 - GOLD5 INSTANT PLAY</button><input id="f" type="file" accept="audio/*" multiple><audio id="p" controls autoplay style="width:100%;margin:10px 0"></audio><p id="now" style="color:#D4AF37;font-weight:800">No track</p><div id="list"></div></div><div class="card"><a href="index.html"><button class="btn dark">👁️ VIEW LISTENER PAGE</button></a></div></div><script>let s=JSON.parse(localStorage.getItem('g5')||'[]'),m=JSON.parse(localStorage.getItem('g5n')||'{}'),c=0,pl=document.getElementById('p');function render(){let l=document.getElementById('list');l.innerHTML='';s.forEach((u,i)=>{l.innerHTML+='<div class=song><span>'+(m[u]||'Song')+'</span><span><button onclick="playAt('+i+')" style="background:#D4AF37;border:none;padding:4px 8px;border-radius:6px;font-weight:800">PLAY</button> <button onclick="del('+i+')" style="background:#300;color:#fff;border:none;padding:4px 8px;border-radius:6px">X</button></span></div>'});localStorage.setItem('g5',JSON.stringify(s));localStorage.setItem('g5n',JSON.stringify(m));}function playAt(i){c=i;pl.src=s[c];pl.play();document.getElementById('now').innerText='Now: '+(m[s[c]]||'Gold');}function del(i){s.splice(i,1);render();}pl.onended=()=>{c=(c+1)%s.length;playAt(c)};document.getElementById('f').addEventListener('change',e=>{for(let f of e.target.files){let u=URL.createObjectURL(f);s.push(u);m[u]=f.name;}render();playAt(s.length-e.target.files.length)});render();</script></body></html>
