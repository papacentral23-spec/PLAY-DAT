<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY DAT STUDIO - STEREO FIX</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;text-align:center}
.top{background:linear-gradient(90deg,gold,orange);color:#000;padding:10px;font-weight:bold;display:flex;justify-content:space-between}
.box{background:#151515;margin:10px;padding:14px;border-radius:12px;border:1px solid #333}
input{padding:12px;border-radius:8px;border:1px solid gold;background:#000;color:#fff;width:70%;font-size:16px}
.btn{padding:12px 22px;border:none;border-radius:25px;font-weight:bold;margin:5px}
.gold{background:gold;color:#000}.green{background:#0f0;color:#000}.red{background:red;color:#fff}
video{width:100%;max-height:180px;background:#000;border-radius:10px}
</style></head><body>
<div class="top"><span>👑 PLAY DAT STUDIO KUMASI</span><span id="dot">⚫ OFFLINE</span></div>

<div class="box">
<h3 style="color:gold;margin:5px">Studio Session Setup</h3>
<label>Host ID:</label><br>
<input id="hostId" value="PLAYDAT999" placeholder="PLAYDAT999"><br><br>
<button class="btn gold" onclick="startStudio()">START</button>
<button class="btn green" id="goBtn" onclick="goLive()" style="display:none">🔴 GO LIVE</button>
<button class="btn red" id="stopBtn" onclick="stopLive()" style="display:none">⏹️ STOP</button>
<div id="stat" style="margin-top:10px;color:#aaa;font-size:12px">Type ID and START</div>
<div style="margin-top:8px;font-size:11px;color:#666">Listener link: <span id="linkShow"></span></div>
</div>

<div class="box">
<video id="localV" autoplay muted playsinline></video>
<div>🎤 <span id="micStat">Mic OFF</span> | 👥 Listeners: <span id="cnt">0</span></div>
<div style="margin-top:10px">
<audio id="mp3Player" controls style="width:100%"></audio>
<input type="file" id="mp3File" accept="audio/mp3,audio/*" style="margin-top:8px">
<div style="font-size:11px;color:#aaa;margin-top:5px">Select MP3 for STEREO playback (not via mic)</div>
</div>
</div>

<div class="box" id="guestBox" style="display:none">
<h4 style="color:gold">Guest Video</h4>
<video id="guestV" autoplay playsinline></video>
<div id="guestStat">No guest</div>
</div>

<script>
let peer, myStream, mp3Stream, audioCtx;
let isLive=false;
let connections=[];

function getId(){return document.getElementById('hostId').value.trim()||'PLAYDAT999';}

async function startStudio(){
 let id=getId();
 document.getElementById('stat').innerText='🔗 Starting with '+id+'... STEREO MODE';
 document.getElementById('dot').innerText='🟡 CONNECTING';

 try{
  // STEREO FIX - FORCE 2 CHANNELS, NO ECHO CANCELLATION
  myStream = await navigator.mediaDevices.getUserMedia({
    video:{width:640,height:360},
    audio:{
      channelCount:2,
      echoCancellation:false,
      autoGainControl:false,
      noiseSuppression:false,
      sampleRate:48000,
      sampleSize:16
    }
  });
  document.getElementById('localV').srcObject=myStream;
  document.getElementById('micStat').innerText='Mic ON - STEREO';

  // MP3 FILE -> STEREO STREAM SETUP
  document.getElementById('mp3File').addEventListener('change', e=>{
    let file=e.target.files[0];
    if(!file) return;
    let url=URL.createObjectURL(file);
    let player=document.getElementById('mp3Player');
    player.src=url;
    // Create stereo stream from MP3 element
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    let source=audioCtx.createMediaElementSource(player);
    let dest=audioCtx.createMediaStreamDestination();
    source.connect(dest);
    source.connect(audioCtx.destination);
    mp3Stream=dest.stream;
    document.getElementById('stat').innerText='🎵 MP3 Loaded - STEREO Ready - Play it when LIVE';
  });

  peer=new Peer(id);
  peer.on('open',()=>{
    document.getElementById('dot').innerText='🟠 READY';
    document.getElementById('stat').innerText='✅ READY - Now tap GO LIVE';
    document.getElementById('goBtn').style.display='inline-block';
    document.getElementById('linkShow').innerHTML=`<a href="listener.html?host=${id}" style="color:gold" target="_blank">listener.html?host=${id}</a>`;
  });

  peer.on('call', call=>{
    // STEREO SDP HACK
    let origAnswer=call.peerConnection.createAnswer.bind(call.peerConnection);
    call.peerConnection.createAnswer=function(){
      return origAnswer().then(sdp=>{
        sdp.sdp=sdp.sdp.replace(/a=fmtp:111.*\r\n/g,'a=fmtp:111 minptime=10; useinbandfec=1; stereo=1; sprop-stereo=1; maxaveragebitrate=510000\r\n');
        return sdp;
      });
    };
    // Answer with STEREO audio
    let streamToSend = (mp3Stream && document.getElementById('mp3Player').src)?
      new MediaStream([...myStream.getVideoTracks(),...mp3Stream.getAudioTracks(),...myStream.getAudioTracks()]) : myStream;
    call.answer(streamToSend);
    connections.push(call);
    document.getElementById('cnt').innerText=connections.length;
    call.on('close',()=>{connections=connections.filter(c=>c!==call);document.getElementById('cnt').innerText=connections.length});
  });

  peer.on('error', e=>{document.getElementById('stat').innerText='❌ ID Taken or Error: '+e.type+' Try PLAYDAT'+Math.floor(Math.random()*9999);document.getElementById('dot').innerText='⚫ OFFLINE'});

 }catch(err){document.getElementById('stat').innerText='❌ Mic Error: '+err.message;document.getElementById('dot').innerText='⚫ OFFLINE'}
}

function goLive(){
 isLive=true;
 document.getElementById('dot').innerText='🔴 LIVE - STEREO';
 document.getElementById('stat').innerText='🔴 LIVE NOW - Playing in STEREO! Share listener link!';
 document.getElementById('goBtn').style.display='none';
 document.getElementById('stopBtn').style.display='inline-block';
}

function stopLive(){
 isLive=false;
 peer.destroy();
 document.getElementById('dot').innerText='⚫ OFFLINE';
 document.getElementById('stat').innerText='⏹️ Stopped';
 document.getElementById('goBtn').style.display='none';
 document.getElementById('stopBtn').style.display='none';
}
</script></body></html>q
